<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title data-i18n="Str_TB_Title">测试机器人</title>
<script src="webloc.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', monospace; background: #0f172a; color: #f8fafc; padding: 20px; }
h1 { text-align: center; margin-bottom: 16px; font-size: 18px; }
.panel { background: #1e293b; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
.panel h2 { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
.row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
input, select { background: #334155; border: 1px solid #475569; color: white; padding: 6px 10px; border-radius: 4px; }
button { padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
.btn-green { background: #22c55e; color: white; }
.btn-blue { background: #3b82f6; color: white; }
.btn-red { background: #ef4444; color: white; }
.btn-gold { background: #f59e0b; color: #000; }
.btn-gray { background: #64748b; color: white; }
.btn-purple { background: #8b5cf6; color: white; }
#log { background: #0f172a; border: 1px solid #334155; border-radius: 4px; height: 250px; overflow-y: auto; padding: 8px; font-size: 12px; color: #94a3b8; white-space: pre-wrap; }
label { color: #94a3b8; font-size: 12px; }
.status-bar { background: #334155; padding: 6px 12px; border-radius: 4px; margin-bottom: 12px; display: flex; justify-content: space-between; font-size: 12px; }
.status-bar .conn { color: #22c55e; }
.status-bar .info { color: #f59e0b; }
.lang-toggle-btn { padding: 6px 14px; background: #64748b; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<!-- 启动连接遮罩：未连上主服务器前不让用户操作 -->
<div id="connectOverlay" style="position:fixed;left:0;top:0;width:100vw;height:100vh;background:rgba(15,23,42,0.96);z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f8fafc;font-family:'Microsoft YaHei',sans-serif;">
    <div style="background:#1e293b;border-radius:12px;padding:36px 48px;min-width:420px;box-shadow:0 8px 30px rgba(0,0,0,.4);">
        <div data-i18n="Str_Common_ConnectServerTitle" style="font-size:22px;font-weight:bold;text-align:center;margin-bottom:18px;">连接主服务器</div>
        <div data-i18n="Str_Common_ServerIpLabel" style="font-size:13px;color:#94a3b8;margin-bottom:6px;">服务器 IP 地址</div>
        <input id="connHostInput" type="text" data-i18n="Str_Common_ServerIpPlaceholder" data-i18n-attr="placeholder" placeholder="如 192.168.1.100" autocomplete="off"
               style="width:100%;padding:10px 12px;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#f8fafc;font-size:16px;outline:none;"/>
        <div style="margin-top:18px;">
            <button onclick="overlayConnect()" data-i18n="Str_Common_Connect" style="width:100%;padding:11px;background:#22c55e;color:white;border:none;border-radius:6px;font-size:15px;font-weight:bold;cursor:pointer;">连接</button>
        </div>
        <div id="connOverlayStatus" style="margin-top:14px;text-align:center;font-size:13px;color:#f59e0b;min-height:18px;">请输入主服务器IP并点击连接</div>
    </div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <h1 data-i18n="Str_TB_H1" style="margin:0;">自动化测试机器人</h1>
    <div style="display:flex;gap:8px;align-items:center;">
        <button class="lang-toggle-btn" onclick="toggleTbLang()" id="langToggleBtn" data-i18n="Str_Common_LangToggle">English</button>
        <button class="fullscreen-btn" onclick="goFullScreen()" data-i18n="Str_Common_Fullscreen" style="padding:6px 14px;background:#3B82F6;color:white;border:none;border-radius:6px;font-size:13px;cursor:pointer;">全屏</button>
    </div>
</div>

<div class="status-bar">
    <span id="connStatus" class="conn" data-i18n="Str_TB_StatusConnecting">连接中...</span>
    <span id="raceInfo" class="info">-</span>
    <span id="timerInfo" class="info">计时: -</span>
</div>

<div class="panel">
    <h2 data-i18n="Str_TB_P1_Title">1. 批量注册运动员（与最新主程序的"组别 / 单位简称 / 备注"字段同步）</h2>
    <div class="row">
        <label data-i18n="Str_TB_Count">数量:</label><input id="regCount" type="number" value="16" style="width:60px">
        <label data-i18n="Str_TB_Event">项目:</label>
        <!-- 2026-06-02 项目/性别/组别 下拉全部改为动态从服务器 data.eventList/data.genderList/data.ageGroups 拉取, 杜绝与现场比赛档案不匹配的报错 -->
        <select id="regEvent" data-i18n-title="Str_TB_AutoFromEventListTitle" title="自动从当前比赛档案的项目列表拉取"></select>
        <label data-i18n="Str_TB_Gender">性别:</label>
        <select id="regGender" data-i18n-title="Str_TB_AutoFromGenderListTitle" title="自动从当前比赛档案的性别列表拉取"></select>
        <label data-i18n="Str_TB_AgeGroup">组别:</label>
        <select id="regAgeGroup" data-i18n-title="Str_TB_RegAgeGroupTitle" title="自动从当前比赛档案的组别列表拉取 (与 _ageGroups 严格一致, 避免下游 Tab 漏出)"></select>
        <!-- 2026-10-14 用户要求: 原来姓名/队名语言是面板内单独一个下拉(nameLang), 跟全局UI语言
             脱钩; 现改为跟随页面右上角的中文/English总开关(toggleTbLang), 单一按钮控制UI文案+
             生成姓名/代表队的语言, 不再需要这里单独一个选择器。isEnglishMode() 直接读 WebLoc。 -->
    </div>
    <div class="row">
        <label data-i18n="Str_TB_Team">代表队:</label>
        <select id="regCountryMode" data-i18n-title="Str_TB_TeamSourceTitle" title="代表队来源">
            <option value="random" data-i18n="Str_TB_TeamModeRandom">随机（内置队名池）</option>
            <option value="fixed" data-i18n="Str_TB_TeamModeFixed">固定值</option>
        </select>
        <input id="regCountryFixed" data-i18n="Str_TB_TeamFixedPlaceholder" data-i18n-attr="placeholder" placeholder="代表队全名" style="width:140px;display:none">
        <input id="regCountryShort" data-i18n="Str_TB_TeamShortPlaceholder" data-i18n-attr="placeholder" placeholder="单位简称（可选，留空则用全名前两字）" style="width:200px">
        <label data-i18n="Str_TB_Notes">备注:</label>
        <input id="regNotes" data-i18n="Str_TB_NotesPlaceholder" data-i18n-attr="placeholder" placeholder="备注（可选，会显示在大屏）" style="width:200px">
        <button class="btn-blue" onclick="batchRegister()" data-i18n="Str_TB_BtnBatchRegister">批量注册</button>
        <button class="btn-purple" onclick="autoGenerateHeats()" data-i18n="Str_TB_BtnAutoGenHeats">自动生成分组</button>
    </div>
    <div class="row">
        <button class="btn-gold" onclick="batchRegisterMixedGroups()" data-i18n="Str_TB_BtnMixedGroups" data-i18n-title="Str_TB_MixedGroupsTitle" title="生成 N 人 × 选中的多个组别 (与当前比赛档案的组别一致), 每组各 N 人">多组别一键样本（各组各 N 人）</button>
        <label style="margin-left:8px;font-size:11px;color:#64748B" data-i18n="Str_TB_PickGroupsLabel">勾选要批量注册的组别 (动态拉取):</label>
        <!-- 2026-06-02 多组别 checkbox 改为动态生成, 来自 data.ageGroups -->
        <span id="mgGroupBoxes"></span>
    </div>
</div>

<div class="panel">
    <h2 data-i18n="Str_TB_P2_Title">2. 模拟比赛流程</h2>
    <div class="row">
        <button class="btn-gold" onclick="simReady()" data-i18n="Str_TB_BtnReady">就位</button>
        <button class="btn-green" onclick="simStart()" data-i18n="Str_TB_BtnStart">发令</button>
        <button class="btn-blue" onclick="simStartBlock('left')" data-i18n="Str_TB_BtnSimStartBlockLeft">模拟左边出发台</button>
        <button class="btn-blue" onclick="simTouchpad('left')" data-i18n="Str_TB_BtnSimTouchpadLeft">模拟左边触板</button>
        <button class="btn-blue" onclick="simBlindWatch('left')" data-i18n="Str_TB_BtnSimBlindLeft">模拟左边盲表</button>
        <button class="btn-purple" onclick="simStartBlock('right')" data-i18n="Str_TB_BtnSimStartBlockRight">模拟右边出发台</button>
        <button class="btn-purple" onclick="simTouchpad('right')" data-i18n="Str_TB_BtnSimTouchpadRight">模拟右边触板</button>
        <button class="btn-purple" onclick="simBlindWatch('right')" data-i18n="Str_TB_BtnSimBlindRight">模拟右边盲表</button>
        <button class="btn-gray" onclick="simConfirm()" data-i18n="Str_TB_BtnConfirmResult">确认成绩</button>
        <button class="btn-red" onclick="simTimerReset()" data-i18n="Str_TB_BtnTimerReset">计时复位</button>
    </div>
</div>

<div class="panel">
    <h2 data-i18n="Str_TB_P3_Title">3. 显示模式切换</h2>
    <div class="row">
        <button class="btn-green" onclick="sendDisplay('SHOW_LIVE_RACE')" data-i18n="Str_TB_BtnShowLiveRace">比赛视图</button>
        <button class="btn-blue" onclick="sendDisplay('SHOW_START_LIST')" data-i18n="Str_TB_BtnShowStartList">出发表</button>
        <button class="btn-purple" onclick="sendDisplay('SHOW_HEAT_RESULT')" data-i18n="Str_TB_BtnShowHeatResult">组成绩</button>
        <button class="btn-gold" onclick="sendDisplay('SHOW_EVENT_RANKING')" data-i18n="Str_TB_BtnShowEventRanking">总排名</button>
        <button class="btn-blue" onclick="sendDisplay('SHOW_TEAM_STANDINGS')" data-i18n="Str_TB_BtnShowTeamStandings">团体</button>
        <button class="btn-red" onclick="sendDisplay('SHOW_AWARDS')" data-i18n="Str_TB_BtnShowAwards">颁奖</button>
        <button class="btn-gray" onclick="sendDisplay('SHOW_WELCOME')" data-i18n="Str_TB_BtnShowWelcome">欢迎</button>
    </div>
</div>

<div class="panel">
    <h2 data-i18n="Str_TB_P4_Title">4. 接力比赛测试</h2>
    <div class="row">
        <label data-i18n="Str_TB_TeamCount">队伍数:</label><input id="relayTeamCount" type="number" value="8" style="width:60px">
        <label data-i18n="Str_TB_Event">项目:</label>
        <select id="relayEvent" onchange="updateRelayButtons()" data-i18n-title="Str_TB_RelayEventTitle" title="自动只显示含'接力'的项目"></select>
        <label data-i18n="Str_TB_Gender">性别:</label>
        <select id="relayGender" data-i18n-title="Str_TB_AutoFromGenderListTitle" title="自动从当前比赛档案的性别列表拉取"></select>
        <label data-i18n="Str_TB_AgeGroup">组别:</label>
        <select id="relayAgeGroup" data-i18n-title="Str_TB_AutoFromAgeGroupListTitle" title="自动从当前比赛档案的组别列表拉取"></select>
        <input id="relayCountryShort" data-i18n="Str_TB_RelayShortPlaceholder" data-i18n-attr="placeholder" placeholder="单位简称（可选）" style="width:160px">
        <button class="btn-blue" onclick="batchRegisterRelay()" data-i18n="Str_TB_BtnRegisterRelay">注册接力队</button>
    </div>
    <div class="row">
        <button class="btn-gold" onclick="simReady()" data-i18n="Str_TB_BtnReady">就位</button>
        <button class="btn-green" onclick="simStart()" data-i18n="Str_TB_BtnStart">发令</button>
    </div>
    <div id="relayStepButtons" class="row" style="flex-wrap:wrap;"></div>
    <div class="row">
        <button class="btn-gray" onclick="simConfirm()" data-i18n="Str_TB_BtnConfirmResult">确认成绩</button>
        <button class="btn-red" onclick="simTimerReset()" data-i18n="Str_TB_BtnTimerReset">计时复位</button>
    </div>
    <div class="row" style="font-size:11px;color:#64748B;" id="relayStepInfo" data-i18n="Str_TB_RelayStepInfoDefault">
        选择项目后显示操作步骤
    </div>
    <!-- 2026-06-03 接力 一键完整自动测试 (4×100 等任意 X×Y, 自动注册队伍/分组/出发台/逐棒触板/确认) -->
    <div class="row">
        <button class="btn-green" onclick="fullAutoTestRelay()" data-i18n="Str_TB_BtnFullAutoRelay">完整自动测试 (接力)</button>
        <button class="btn-red" onclick="stopAutoTest()" data-i18n="Str_TB_BtnStopAutoTest">停止</button>
        <label data-i18n="Str_TB_RelayFlowLabel">注册接力队→分组→就位→发令→逐棒(出发台+触板+盲表)→确认</label>
    </div>
</div>

<div class="panel">
    <h2 data-i18n="Str_TB_P5_Title">5. 完整自动测试（个人项目）</h2>
    <div class="row">
        <button class="btn-green" onclick="fullAutoTest()" data-i18n="Str_TB_BtnFullAutoTest">开始完整测试</button>
        <button class="btn-red" onclick="stopAutoTest()" data-i18n="Str_TB_BtnStopAutoTest">停止</button>
        <label data-i18n="Str_TB_IndivFlowLabel">注册→分组→就位→发令→出发→等待触板打开→触板→确认</label>
    </div>
</div>

<!-- 2026-07-12 反应时端到端测试面板 (硬件送帧粒度控制, 替代 ReactionTimeE2E.exe REPL) -->
<div class="panel">
    <h2 data-i18n="Str_TB_P6_Title">6. 反应时端到端测试（直接送硬件数据）</h2>
    <div class="row">
        <label data-i18n="Str_TB_GunLabel">Gun PreStart 秒:</label>
        <input id="e2eGun" type="number" step="0.001" value="100.000" style="width:100px">
        <button class="btn-gold" onclick="e2eSendGun()" data-i18n="Str_TB_BtnSendGun">送 Gun (0x22 GunPreStart)</button>
        <label style="color:#94a3b8;font-size:11px;margin-left:8px;" data-i18n="Str_TB_GunHint">先送 gun 锚定 _gunPreStartSec, 再送 SB/TP</label>
    </div>
    <div class="row">
        <label data-i18n="Str_TB_Lane">泳道:</label>
        <select id="e2eLane" style="width:60px">
            <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option><option>9</option>
        </select>
        <label data-i18n="Str_TB_Side">端:</label>
        <select id="e2eSide" style="width:70px">
            <option value="left" data-i18n="Str_TB_SideLeft">左</option><option value="right" data-i18n="Str_TB_SideRight">右</option>
        </select>
        <label data-i18n="Str_TB_TimeSec">时间(秒):</label>
        <input id="e2eTime" type="number" step="0.001" value="100.600" style="width:100px">
        <label style="color:#94a3b8;font-size:11px;" data-i18n="Str_TB_SbTpHint">SB/触放 是 PreStart 秒 (rt=time-gunPreStart); TP 是 running 秒</label>
    </div>
    <div class="row">
        <button class="btn-blue" onclick="e2eSend('StartingBlock', false)" data-i18n="Str_TB_BtnSendSB">送 SB 出发台</button>
        <button class="btn-red" onclick="e2eSend('StartingBlock', true)" data-i18n="Str_TB_BtnSendSBFalse">送 SB 抢跳</button>
        <button class="btn-green" onclick="e2eSend('Touchpad', false)" data-i18n="Str_TB_BtnSendTP">送 TP 触板</button>
        <button class="btn-purple" onclick="e2eSend('BackstrokeRelease', false)" data-i18n="Str_TB_BtnSendBackstroke">送 仰泳松开</button>
        <button class="btn-gray" onclick="e2eSend('PushButton1', false)" data-i18n="Str_TB_BtnSendBlind1">送 盲1</button>
        <button class="btn-gray" onclick="e2eSend('PushButton2', false)" data-i18n="Str_TB_BtnSendBlind2">送 盲2</button>
        <button class="btn-gray" onclick="e2eSend('PushButton3', false)" data-i18n="Str_TB_BtnSendBlind3">送 盲3</button>
    </div>
    <div class="row">
        <button class="btn-gold" onclick="e2eRefresh()" data-i18n="Str_TB_BtnRefreshObs">刷新观察</button>
        <label style="color:#94a3b8;font-size:11px;" data-i18n="Str_TB_ObsHint">主服务器 status 广播 100ms 自动来, 手工点也可</label>
        <button class="btn-gray" onclick="e2ePreset('50m自由')" data-i18n="Str_TB_BtnPreset50Free">预设:50m 自由 (right/100.6)</button>
        <button class="btn-gray" onclick="e2ePreset('4x50-leg2')" data-i18n="Str_TB_BtnPreset4x50Leg2">预设:4×50 棒2交接 (opp/130.4)</button>
    </div>
    <div style="background:#0f172a;padding:8px;font-family:Consolas,monospace;font-size:11px;color:#94a3b8;max-height:200px;overflow:auto;margin-top:8px;border:1px solid #334155;border-radius:4px;" id="e2eObservation" data-i18n="Str_TB_ObsDefault">(点"刷新观察" 或送帧后自动更新)</div>
    <div style="background:#0f172a;padding:8px;font-family:Consolas,monospace;font-size:11px;color:#f8fafc;max-height:150px;overflow:auto;margin-top:6px;border:1px solid #334155;border-radius:4px;" id="e2eLaneLog" data-i18n="Str_TB_LaneLogDefault">(选中泳道后显示 laneEventLog)</div>
</div>

<div class="panel">
    <h2 data-i18n="Str_TB_LogTitle">日志</h2>
    <div id="log"></div>
    <div class="row" style="margin-top:8px;">
        <button class="btn-gray" onclick="document.getElementById('log').innerHTML=''" data-i18n="Str_TB_BtnClearLog">清除日志</button>
    </div>
</div>

<script>
var ws, data = {}, autoRunning = false;
// 2026-06-03 sim* 函数道间延时 (ms), 防止 8 道 burst send 一次性触发 32 次 SHOW_LIVE_RACE 全量广播
var _SIM_LANE_GAP_MS = 15;

window.onbeforeunload = function(e) { e.preventDefault(); e.returnValue = ''; return WebLoc.t('Str_TB_ConfirmClose'); };

function goFullScreen() { var el=document.documentElement; if(document.fullscreenElement)return; if(el.requestFullscreen)el.requestFullscreen(); else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen(); else if(el.msRequestFullscreen)el.msRequestFullscreen(); }
document.addEventListener('fullscreenchange', function() { var btns=document.querySelectorAll('.fullscreen-btn'); for(var i=0;i<btns.length;i++) btns[i].style.display=document.fullscreenElement?'none':''; });
document.addEventListener('webkitfullscreenchange', function() { var btns=document.querySelectorAll('.fullscreen-btn'); for(var i=0;i<btns.length;i++) btns[i].style.display=document.webkitFullscreenElement?'none':''; });

// 2026-10-14 页面右上角中文/English总开关: 切UI文案的同时, 也让生成姓名/代表队跟着换语言
// (isEnglishMode() 直接读 WebLoc, 不再需要面板内单独的 nameLang 下拉), 并强制重绘所有依赖
// 当前语言的动态内容(下拉框性别展示文本/组次占位符/接力步骤按钮/连接遮罩默认文案等)。
function toggleTbLang() {
    WebLoc.toggle();
    WebLoc.apply();
    _lastDropdownSig = '';           // 强制 syncBotDropdowns 重绘(性别展示文本跟着语言变)
    try { syncBotDropdowns(); } catch (e) {}
    try { updateStatusBar(); } catch (e) {}
    try { updateRelayButtons(); } catch (e) {}
    var ov = document.getElementById('connectOverlay');
    if (ov && ov.style.display !== 'none') {
        var st = document.getElementById('connOverlayStatus');
        // 遮罩文案只有在还没开始尝试连接(没有失败计数)时才用默认提示语覆盖, 避免打断正在显示的错误/重试文案
        if (st && _connFailCount === 0) st.textContent = WebLoc.t('Str_TB_ConnPromptDefault');
    }
}

var _connFailCount = 0;

// 启动连接遮罩控制
function getInitialHost() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('host')) return params.get('host');
    if (location.hostname && location.hostname !== '' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return location.hostname;
    return localStorage.getItem('swimServerHost') || '192.168.1.100';
}
function showConnectOverlay(text, color) {
    var ov = document.getElementById('connectOverlay');
    if (ov) ov.style.display = 'flex';
    var st = document.getElementById('connOverlayStatus');
    if (st) { st.textContent = text || WebLoc.t('Str_TB_ConnPromptDefault'); st.style.color = color || '#f59e0b'; }
}
function hideConnectOverlay() {
    var ov = document.getElementById('connectOverlay');
    if (ov) ov.style.display = 'none';
}
function overlayConnect() {
    var inp = document.getElementById('connHostInput');
    var ip = inp ? inp.value.trim() : '';
    if (!ip) { showConnectOverlay(WebLoc.t('Str_TB_ConnPromptEmptyIp'), '#ef4444'); return; }
    localStorage.setItem('swimServerHost', ip);
    _connFailCount = 0;
    if (ws) try { ws.close(); } catch(e) {}
    showConnectOverlay(WebLoc.f('Str_TB_ConnConnectingFmt', ip), '#f59e0b');
    connect();
}

// 兼容旧版：保留 prompt 询问 IP，外部代码可调用
function getServerHost(forceAsk) {
    var params = new URLSearchParams(window.location.search);
    if (params.get('host')) return params.get('host');
    if (!forceAsk && location.hostname && location.hostname !== '' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return location.hostname;
    var saved = localStorage.getItem('swimServerHost');
    if (!forceAsk && saved) return saved;
    var def = saved || '192.168.1.100';
    var ip = prompt(WebLoc.t('Str_TB_PromptServerIp'), def);
    if (ip) { localStorage.setItem('swimServerHost', ip); return ip; }
    return saved || 'localhost';
}
function changeServerHost() {
    showConnectOverlay(WebLoc.t('Str_TB_ResetServerPrompt'), '#f59e0b');
    _connFailCount = 0;
}

function connect() {
    var host = localStorage.getItem('swimServerHost') || getInitialHost();
    try { ws = new WebSocket('ws://' + host + ':3002'); }
    catch (ex) { showConnectOverlay(WebLoc.f('Str_TB_ConnCtorFailedFmt', ex.message), '#ef4444'); return; }
    ws.onopen = function() {
        _connFailCount = 0;
        document.getElementById('connStatus').textContent = WebLoc.f('Str_TB_ConnConnectedFmt', host);
        log(WebLoc.f('Str_TB_LogConnectedFmt', host));
        hideConnectOverlay();   // 只有连接成功才进入主界面
    };
    ws.onclose = function() {
        document.getElementById('connStatus').textContent = WebLoc.t('Str_TB_ConnDisconnectedRetrying');
        document.getElementById('connStatus').style.color = '#ef4444';
        _connFailCount++;
        showConnectOverlay(WebLoc.f('Str_TB_ConnRetryStatusFmt', _connFailCount), '#ef4444');
        if (_connFailCount >= 3) { _connFailCount = 0; if (confirm(WebLoc.t('Str_TB_ConfirmResetServer'))) { changeServerHost(); return; } }
        setTimeout(connect, 3000);
    };
    ws.onerror = function() {
        showConnectOverlay(WebLoc.t('Str_TB_ConnErrorCheckIp'), '#ef4444');
    };
    ws.onmessage = function(e) {
        try {
            var msg = JSON.parse(e.data);
            if (msg.data) data = msg.data;
            updateStatusBar();
            // 2026-06-02 收到任意服务器广播 → 同步动态填充下拉 (eventList/genderList/ageGroups)
            //   _lastDropdownSig 防止每条 100ms 帧都重画 (除非内容变化)
            try { syncBotDropdowns(); } catch(ex2) {}
            // 2026-07-12 面板 6 反应时端到端: 自动刷新观察区
            try { if (document.getElementById('e2eObservation')) e2eRefresh(); } catch(ex3) {}
        } catch(ex) {}
    };
}

var _lastDropdownSig = '';
function syncBotDropdowns() {
    if (!data) return;
    var events = (data.eventList && data.eventList.length > 0) ? data.eventList : [];
    var genders = (data.genderList && data.genderList.length > 0) ? data.genderList : (WebLoc.currentLang() === 'en' ? ['Men','Women','Mixed'] : ['男','女','混合']);
    var ages = (data.ageGroups && data.ageGroups.length > 0) ? data.ageGroups : [];
    var sig = JSON.stringify({e: events, g: genders, a: ages});
    if (sig === _lastDropdownSig) return;   // 内容没变就跳过
    _lastDropdownSig = sig;

    // 个人项目下拉 (排除接力)
    var indEvents = [];
    var relayEvents = [];
    for (var i = 0; i < events.length; i++) {
        if (isRelayEventName(events[i])) relayEvents.push(events[i]);
        else indEvents.push(events[i]);
    }
    var notSpecified = WebLoc.t('Str_TB_NotSpecified');
    var noRelayEvent = WebLoc.t('Str_TB_NoRelayEvent');
    _fillSelect('regEvent', indEvents);
    _fillSelect('regGender', genders, null, genderSelectDisplay);
    _fillSelect('regAgeGroup', [notSpecified].concat(ages), WebLoc.t('Str_TB_NotSpecifiedTitle'));
    _fillSelect('relayEvent', relayEvents.length > 0 ? relayEvents : [noRelayEvent]);
    _fillSelect('relayGender', genders, null, genderSelectDisplay);
    _fillSelect('relayAgeGroup', [notSpecified].concat(ages));

    // 多组别 checkbox 动态生成 (与 ageGroups 完全一致)
    var box = document.getElementById('mgGroupBoxes');
    if (box) {
        // 先记住之前的勾选状态
        var prev = {};
        var existing = box.querySelectorAll('input[type=checkbox]');
        for (var j = 0; j < existing.length; j++) prev[existing[j].value] = existing[j].checked;
        box.innerHTML = '';
        if (ages.length === 0) {
            box.innerHTML = '<span style="color:#94a3b8;font-size:11px;">' + WebLoc.t('Str_TB_NoAgeGroupsConfigured') + '</span>';
        } else {
            for (var k = 0; k < ages.length; k++) {
                var ag = ages[k];
                var lab = document.createElement('label');
                lab.style.marginRight = '6px';
                var chk = document.createElement('input');
                chk.type = 'checkbox';
                chk.className = 'mg-group-chk';
                chk.value = ag;
                // 之前勾过的保持; 默认头 2 个勾选
                chk.checked = (prev[ag] !== undefined) ? prev[ag] : (k < 2);
                lab.appendChild(chk);
                lab.appendChild(document.createTextNode(' ' + ag));
                box.appendChild(lab);
            }
        }
    }

    if (typeof updateRelayButtons === 'function') {
        try { updateRelayButtons(); } catch(e) {}
    }
}

// 2026-10-14 displayFn(可选): 下拉项"给人看"的展示文本转换(如性别 男/女/混合 -> Men/Women/Mixed),
//   option.value 永远保持服务器原始值不变(送给服务器的还是原始字面量, 不受展示语言影响)。
function _fillSelect(id, options, title, displayFn) {
    var sel = document.getElementById(id);
    if (!sel) return;
    var prev = sel.value;
    var notSpecified = WebLoc.t('Str_TB_NotSpecified');
    var noRelayEvent = WebLoc.t('Str_TB_NoRelayEvent');
    sel.innerHTML = '';
    for (var i = 0; i < options.length; i++) {
        var op = document.createElement('option');
        op.value = (options[i] === notSpecified || options[i] === noRelayEvent) ? '' : options[i];
        op.textContent = displayFn ? displayFn(options[i]) : options[i];
        sel.appendChild(op);
    }
    // 尝试还原之前选择
    var matched = false;
    for (var j = 0; j < sel.options.length; j++) {
        if (sel.options[j].value === prev) { sel.selectedIndex = j; matched = true; break; }
    }
    if (!matched && sel.options.length > 0) sel.selectedIndex = 0;
    if (title) sel.title = title;
}

// 2026-06-03 log() 改 createTextNode 增量追加 + requestAnimationFrame 批量刷 scroll, 防止
//   一次性 8 道触板 +24 盲表 32 条 send 时 innerHTML+= 重新解析全部 log 内容 导致 test_bot 闪
var _logScrollScheduled = false;
function log(msg) {
    var el = document.getElementById('log');
    if (!el) return;
    var now = new Date();
    var time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ':' + now.getSeconds().toString().padStart(2,'0');
    el.appendChild(document.createTextNode('[' + time + '] ' + msg + '\n'));
    if (!_logScrollScheduled) {
        _logScrollScheduled = true;
        requestAnimationFrame(function() {
            _logScrollScheduled = false;
            el.scrollTop = el.scrollHeight;
        });
    }
}

function parseRunningTime() {
    var runTimeStr = (data && data.runningTime) ? data.runningTime : '0.0';
    var parts = runTimeStr.split(':');
    if (parts.length === 3) return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
    if (parts.length === 2) return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
    return parseFloat(parts[0]) || 0;
}

}

function randomTime(min, max) {

function formatTime(totalSeconds) {
    var totalCentis = Math.round(totalSeconds * 100);
    var centis = totalCentis % 100;
    var totalSecs = Math.floor(totalCentis / 100);
    var secs = totalSecs % 60;
    var mins = Math.floor(totalSecs / 60) % 60;
    var hours = Math.floor(totalSecs / 3600);
    var cs = centis.toString().padStart(2, '0');
    if (hours > 0) return hours + ':' + mins.toString().padStart(2,'0') + ':' + secs.toString().padStart(2,'0') + '.' + cs;
    if (mins > 0) return mins + ':' + secs.toString().padStart(2,'0') + '.' + cs;
    return secs + '.' + cs;
}

// 2026-06-02 优先用服务器 data.ageGroupsDetail (含 minAge/maxAge), 回退到硬编码常见命名, 再回退默认 18-29
function ageRangeFor(ageGroup) {
    // 服务器配置优先
    if (data && data.ageGroupsDetail && data.ageGroupsDetail.length > 0 && ageGroup) {
        for (var i = 0; i < data.ageGroupsDetail.length; i++) {
            var ag = data.ageGroupsDetail[i];
            if (ag.name === ageGroup) {
                var min = parseInt(ag.minAge), max = parseInt(ag.maxAge);
                if (!isNaN(min) && !isNaN(max) && max >= min && max > 0) return [min, max];
            }
        }
    }
    // 硬编码后备
    switch (ageGroup) {
        case '青少年': return [12, 13];
        case '少年':   return [14, 17];
        case '青年':   return [15, 24];
        case '成年':
        case '成人':   return [18, 45];
        case '大师':
        case '老年':   return [46, 70];
        default:       return [18, 29];
    }
}
function randomAgeFor(ageGroup) {
    var r = ageRangeFor(ageGroup);
    return r[0] + Math.floor(Math.random() * (r[1] - r[0] + 1));
}

// 根据 entryTime 长度估算（按项目距离/接力总距离）
function estimateEntryTime(distMeters) {
    if (distMeters <= 50)  return randomTime(22, 30);
    if (distMeters <= 100) return randomTime(48, 58);
    if (distMeters <= 200) return randomTime(105, 125);
    if (distMeters <= 400) return randomTime(230, 270);
    if (distMeters <= 800) return randomTime(480, 550);
    if (distMeters <= 1500) return randomTime(880, 960);
    return randomTime(440, 500);
}

function pickTeam(mode, fixedName, idx) {
    if (mode === 'fixed' && fixedName) return fixedName;
    var arr = isEnglishMode() ? teamsEN : teams;
    var t = arr[idx % arr.length];
    if (idx >= arr.length) t += (isEnglishMode() ? ' ' : '') + (Math.floor(idx / arr.length) + 1);
    return t;
}

function batchRegister() {
    _usedNames = {};
    var count = parseInt(document.getElementById('regCount').value) || 16;
    var ev = document.getElementById('regEvent').value;
    var gender = document.getElementById('regGender').value;
    var ageGroup = document.getElementById('regAgeGroup').value || '';
    var countryMode = document.getElementById('regCountryMode').value || 'random';
    var countryFixed = (document.getElementById('regCountryFixed').value || '').trim();
    var countryShort = (document.getElementById('regCountryShort').value || '').trim();
    var notes = (document.getElementById('regNotes').value || '').trim();
    var isRelay = isRelayEventName(ev);

    if (isRelay) {
        var relayMatch = ev.match(/(\d+)\s*[xX×]\s*(\d+)/);  // 2026-06-03 兼容 4x50 / 4×50 (Chinese ×) / 4 X 50 多种写法
        var legCount = relayMatch ? parseInt(relayMatch[1]) : 4;
        var legDist = relayMatch ? parseInt(relayMatch[2]) : 100;
        var totalDist = legCount * legDist;

        for (var i = 0; i < count; i++) {
            var teamName = pickTeam(countryMode, countryFixed, i);
            var legs = [];
            for (var j = 1; j <= legCount; j++) {
                var memberAge = randomAgeFor(ageGroup);
                var memberGender = altGenderValue(gender, j);
                legs.push({
                    legOrder: j,
                    swimmerName: randomName(memberGender),
                    swimmerBibNumber: '',
                    gender: memberGender,
                    age: memberAge,
                    country: teamName,
                    idNumber: randomID(),
                    phone: randomPhone(),
                    birthDate: birthDateForAge(memberAge)
                });
            }
            send('REGISTER_RELAY', {
                teamName: teamName,
                eventName: ev,
                gender: gender,
                ageGroup: ageGroup,
                countryShort: countryShort || lookupTeamAbbrEN(teamName),
                notes: notes,
                entryTime: estimateEntryTime(totalDist),
                legs: legs
            });
        }

function simStartBlock(side) {
    var lanes = getLanes();
    var threshold = (data && data.laneCloseSettings) ? data.laneCloseSettings.falseStartThreshold || 0.10 : 0.10;

    // 随机选3道抢跳
    var indices = [];
    for (var j = 0; j < lanes.length; j++) indices.push(j);
    for (var j = indices.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var tmp = indices[j]; indices[j] = indices[k]; indices[k] = tmp;
    }
    var fsNegIdx = indices[0];
    var fsLow1Idx = indices.length > 1 ? indices[1] : -1;
    var fsLow2Idx = indices.length > 2 ? indices[2] : -1;

    log(WebLoc.f('Str_TB_LogSimStartBlockHeaderFmt', sideDisplay(side), threshold));
    // 2026-06-03 道间延时分散广播 (同 simTouchpad)
    var fsLanes = [];
    var i = 0;
    function next() {
        if (i >= lanes.length) { log(WebLoc.f('Str_TB_LogFalseStartLanesFmt', fsLanes.join(','))); return; }
        var lane = lanes[i];
        var rt;
        if (i === fsNegIdx) {
            rt = -(Math.random() * 0.05 + 0.01);
            rt = parseFloat(rt.toFixed(3));
            send('TIMING_DATA', {lane: lane, commandType: 'StartingBlock', time: rt, side: side});
            send('FALSE_START_DETECTED', {lane: lane, reactionTime: rt});
            log(WebLoc.f('Str_TB_LogFalseStartNegFmt', lane, sideDisplay(side), rt.toFixed(3)));
            fsLanes.push(lane);
        } else if (i === fsLow1Idx || i === fsLow2Idx) {
            rt = 0.02 + Math.random() * (threshold - 0.02);
            rt = parseFloat(rt.toFixed(3));
            send('TIMING_DATA', {lane: lane, commandType: 'StartingBlock', time: rt, side: side});
            send('FALSE_START_DETECTED', {lane: lane, reactionTime: rt});
            log(WebLoc.f('Str_TB_LogFalseStartLowFmt', lane, sideDisplay(side), rt.toFixed(3)));
            fsLanes.push(lane);
        } else {
            rt = 0.50 + Math.random() * 0.35;
            rt = parseFloat(rt.toFixed(2));
            send('TIMING_DATA', {lane: lane, commandType: 'StartingBlock', time: rt, side: side});
            log(WebLoc.f('Str_TB_LogNormalStartFmt', lane, sideDisplay(side), rt.toFixed(2)));
        }
        i++;
        setTimeout(next, _SIM_LANE_GAP_MS);
    }
    next();
}

// 记录每道触板历史，用于计算下一段的合理时间
var _lastTouchpadTime = {};  // 每道最近一次触板的绝对时间
var _touchpadLapCount = {};  // 每道已触板的段数

// 2026-06-03 sim* 函数道间小延时 (= _SIM_LANE_GAP_MS, 顶上声明), 让 server 处理 + broadcast 排空,
//   减轻 display.html / 主控 同时收 8 帧 SHOW_LIVE_RACE 全量状态导致的画面闪烁;
//   实际"同时触板"语义上没意义 (硬件本来就有 µs 级时差)
function simTouchpad(side) {
    var lanes = getLanes();
    var currentServerTime = parseRunningTime();
    var segTime = 26;
    log(WebLoc.f('Str_TB_LogSimTouchpadHeaderFmt', sideDisplay(side)));
    var i = 0;
    function next() {
        if (i >= lanes.length) return;
        var lane = lanes[i];
        if (!_touchpadLapCount[lane]) _touchpadLapCount[lane] = 0;
        if (!_lastTouchpadTime[lane]) _lastTouchpadTime[lane] = 0;
        _touchpadLapCount[lane]++;
        var lapNum = _touchpadLapCount[lane];
        var t = currentServerTime + (Math.random() - 0.3) * 0.5;
        if (t < 1) t = segTime * lapNum;
        _lastTouchpadTime[lane] = t;
        send('TIMING_DATA', {lane: lane, commandType: 'Touchpad', time: t, side: side});
        log(WebLoc.f('Str_TB_LogTouchpadSegFmt', lane, sideDisplay(side), lapNum, t.toFixed(2)));
        i++;
        setTimeout(next, _SIM_LANE_GAP_MS);
    }
    next();
}

// 接力赛步骤跟踪
var _relayStepTime = {};  // 每道上次触板绝对时间
var _relayStepCount = 0;  // 当前已执行的步骤数

function getRelayParams() {
    var ev = document.getElementById('relayEvent').value;
    var m = ev.match(/(\d+)\s*[x×]\s*(\d+)/);
    var legCount = m ? parseInt(m[1]) : 4;
    var legDist = m ? parseInt(m[2]) : 100;
    var poolLen = (data && data.poolConfig) ? data.poolConfig.length || 50 : 50;
    var lapsPerLeg = Math.max(1, Math.floor(legDist / poolLen));
    var segTime = legDist <= 100 ? 28 : 30;  // 每50米约28-30秒
    return { legCount: legCount, legDist: legDist, poolLen: poolLen, lapsPerLeg: lapsPerLeg, segTime: segTime };
}

function updateRelayButtons() {
    var p = getRelayParams();
    var totalLaps = p.legCount * p.lapsPerLeg;
    var html = '';
    var stepNum = 0;
    var info = '';

    for (var leg = 1; leg <= p.legCount; leg++) {
        // 出发台检测
        stepNum++;
        var sbColor = leg === 1 ? 'btn-blue' : 'btn-green';
        var sbLabel = leg === 1 ? WebLoc.f('Str_TB_RelayLeg1StartFmt', leg) : WebLoc.f('Str_TB_RelayLegStartBlockFmt', leg);
        html += '<button class="' + sbColor + '" onclick="simRelayStartBlock(' + leg + ')" style="margin:2px;font-size:11px;padding:4px 8px;">' + sbLabel + '</button>';
        info += sbLabel + ' → ';

        // 每段触板+盲表
        for (var lap = 1; lap <= p.lapsPerLeg; lap++) {
            stepNum++;
            var globalLap = (leg - 1) * p.lapsPerLeg + lap;
            var isLegEnd = (lap === p.lapsPerLeg);
            var isFinal = (leg === p.legCount && isLegEnd);
            var label = '';
            if (isFinal) label = WebLoc.t('Str_TB_RelayFinishTouch');
            else if (isLegEnd && leg < p.legCount) label = WebLoc.t('Str_TB_RelayExchangeTouch');
            else label = WebLoc.f('Str_TB_RelayLegSegFmt', leg, lap);
            html += '<button class="btn-purple" onclick="simRelayTouchpad(' + leg + ',' + lap + ',' + globalLap + ')" style="margin:2px;font-size:11px;padding:4px 8px;">' + label + '</button>';
            info += label + (isFinal ? '' : ' → ');
        }
    }

    document.getElementById('relayStepButtons').innerHTML = html;
    document.getElementById('relayStepInfo').textContent = WebLoc.f('Str_TB_RelayStepInfoFmt', info, totalLaps, p.lapsPerLeg);
    _relayStepTime = {};
    _relayStepCount = 0;

function simRelayTouchpad(legNum, lapInLeg, globalLap) {
    var p = getRelayParams();
    var lanes = getLanes();
    var isLegEnd = (lapInLeg === p.lapsPerLeg);
    var isFinal = (legNum === p.legCount && isLegEnd);
    var segTime = p.segTime;

    var desc = '';
    if (isFinal) desc = WebLoc.t('Str_TB_Relay_FinishDesc');
    else if (isLegEnd) desc = WebLoc.f('Str_TB_Relay_ExchangeDescFmt', legNum, legNum + 1);

    var currentServerTime = parseRunningTime();
    // 2026-06-03 加 道间延时 (= _SIM_LANE_GAP_MS), 防止 8 道 × 4 帧 (TP+3 PB) 同时发 32 条

    var i = 0;
    function next() {

        var lane = lanes[i];
        var t = currentServerTime + (Math.random() - 0.3) * 0.5;
        if (t < 1) t = segTime * globalLap;
        _relayStepTime[lane] = t;
        send('TIMING_DATA', {lane: lane, commandType: 'Touchpad', time: t});

        for (var b = 1; b <= 3; b++) {

    next();

function stopAutoTest() { autoRunning = false; log(WebLoc.t('Str_TB_LogAutoTestStopped')); }

function fullAutoTest() {
    autoRunning = true;
    var ev = document.getElementById('regEvent').value;
    var dist = parseInt(ev.match(/(\d+)/)[1]) || 100;
    var poolLen = (data && data.poolConfig) ? data.poolConfig.length || 50 : 50;
    var totalLaps = Math.max(1, Math.floor(dist / poolLen));
    var closeTime = (data && data.laneCloseSettings) ? data.laneCloseSettings.laneCloseTime || 20 : 20;

    log(WebLoc.t('Str_TB_FA_Header'));
    log(WebLoc.f('Str_TB_FA_InfoFmt', ev, dist, totalLaps, closeTime));

    // Step 1: 注册
    batchRegister();
    log(WebLoc.t('Str_TB_FA_Step1'));

    setTimeout(function() {
        if (!autoRunning) return;
        // Step 2: 自动分组
        autoGenerateHeats();
        log(WebLoc.t('Str_TB_FA_Step2'));

        setTimeout(function() {
            if (!autoRunning) return;
            // Step 3: 就位
            simReady();
            log(WebLoc.t('Str_TB_FA_Step3'));

            setTimeout(function() {
                if (!autoRunning) return;
                // Step 4: 发令
                simStart();
                log(WebLoc.t('Str_TB_FA_Step4'));

                setTimeout(function() {
                    if (!autoRunning) return;
                    // Step 5: 出发 — 出发台在出发端
                    var startSide = (data && data.laneCloseSettings && data.laneCloseSettings.startPosition) || 'left';
                    var oppSide = (startSide === 'left') ? 'right' : 'left';
                    simStartBlock(startSide);
                    log(WebLoc.f('Str_TB_FA_Step5Fmt', sideDisplay(startSide)));

                    // Step 6: 逐段触板（奇数段=出发对面, 偶数段=出发端）
                    var lap = 0;
                    function doLap() {
                        if (!autoRunning) return;
                        lap++;
                        var lapSide = (lap % 2 === 1) ? oppSide : startSide;
                        // 等泳道打开（关闭时间+2秒余量）
                        var waitTime = (closeTime + 2) * 1000;
                        log(WebLoc.f('Str_TB_FA_WaitOpenFmt', closeTime + 2));
                        setTimeout(function() {
                            if (!autoRunning) return;
                            log(WebLoc.f('Str_TB_FA_Step6Fmt', lap, totalLaps, sideDisplay(lapSide)));
                            simTouchpad(lapSide);
                            // 同时发盲表
                            setTimeout(function() {
                                if (!autoRunning) return;
                                simBlindWatch(lapSide);
                            }, 500);

                            if (lap < totalLaps) {
                                // 还有下一段
                                setTimeout(doLap, 3000);
                            } else {
                                // 全部完成，确认成绩
                                setTimeout(function() {
                                    if (!autoRunning) return;
                                    simConfirm();
                                    log(WebLoc.t('Str_TB_FA_Step7'));
                                    log(WebLoc.t('Str_TB_FA_End'));
                                    autoRunning = false;
                                }, 2000);
                            }
                        }, waitTime);
                    }
                    doLap();
                }, 1000);
            }, 2000);
        }, 2000);
    }, 1000);
}

// 2026-06-03 接力 完整自动测试 (4×100 等任意 X×Y 项目)
//   流程: 注册接力队 → 自动分组 → 就位 → 发令 → 逐棒(出发台 → 每段触板+盲表) → 确认
//   时序: 各棒之间不再额外等待"泳道关闭", 因为接力触板间隔 = legDist 实际泳速 (50m≈28s), 不会触发关闭窗口
function fullAutoTestRelay() {
    autoRunning = true;
    var ev = document.getElementById('relayEvent').value;
    if (!isRelayEventName(ev)) {
        log(WebLoc.t('Str_TB_FAR_ErrNotRelay'));
        autoRunning = false;
        return;
    }
    var p = getRelayParams();
    var teamCount = parseInt(document.getElementById('relayTeamCount').value) || 8;
    var totalLaps = p.legCount * p.lapsPerLeg;
    var closeTime = (data && data.laneCloseSettings) ? data.laneCloseSettings.laneCloseTime || 20 : 20;
    var legSwimMs = p.segTime * p.lapsPerLeg * 1000;   // 每棒模拟泳进时间 (50m ≈ 28s × lapsPerLeg)

    log(WebLoc.f('Str_TB_FAR_HeaderFmt', ev, p.legCount, p.legDist, teamCount, totalLaps));

    // Step 1: 注册接力队
    batchRegisterRelay();
    log(WebLoc.f('Str_TB_FAR_Step1Fmt', teamCount));

    setTimeout(function() {
        if (!autoRunning) return;
        // Step 2: 自动分组
        autoGenerateHeats();
        log(WebLoc.t('Str_TB_FAR_Step2'));

        setTimeout(function() {
            if (!autoRunning) return;
            // Step 3: 就位
            simReady();
            log(WebLoc.t('Str_TB_FAR_Step3'));

            setTimeout(function() {
                if (!autoRunning) return;
                // Step 4: 发令
                simStart();
                log(WebLoc.t('Str_TB_FAR_Step4'));

                setTimeout(function() {
                    if (!autoRunning) return;
                    // Step 5: 第 1 棒出发 (常规出发台反应时)
                    simRelayStartBlock(1);
                    log(WebLoc.t('Str_TB_FAR_Step5'));

                    // Step 6: 逐棒 / 逐段触板
                    var leg = 1, lap = 1;
                    function nextStep() {
                        if (!autoRunning) return;
                        var globalLap = (leg - 1) * p.lapsPerLeg + lap;
                        var isLegEnd = (lap === p.lapsPerLeg);
                        var isFinal = (leg === p.legCount && isLegEnd);

                        // 模拟一段泳进时间后触板
                        var swimWait = p.segTime * 1000;
                        log(WebLoc.f('Str_TB_FAR_SwimWaitFmt', p.legDist / p.lapsPerLeg, p.segTime));
                        setTimeout(function() {
                            if (!autoRunning) return;
                            log(WebLoc.f('Str_TB_FAR_Step6Fmt', leg, lap, p.lapsPerLeg, globalLap, totalLaps));
                            simRelayTouchpad(leg, lap, globalLap);

                            // 如果是 leg 末段且不是最后一棒, 下一棒出发台 (= 交接)
                            if (isLegEnd && !isFinal) {
                                setTimeout(function() {
                                    if (!autoRunning) return;
                                    leg++;
                                    lap = 1;
                                    log(WebLoc.f('Str_TB_FAR_ExchangeFmt', leg));
                                    simRelayStartBlock(leg);
                                    setTimeout(nextStep, 800);
                                }, 600);
                            } else if (!isFinal) {
                                // 同棒内下一段
                                lap++;
                                setTimeout(nextStep, 800);
                            } else {
                                // 终点触板, 全部完成
                                setTimeout(function() {
                                    if (!autoRunning) return;
                                    simConfirm();
                                    log(WebLoc.t('Str_TB_FAR_Step7'));
                                    log(WebLoc.t('Str_TB_FAR_End'));
                                    autoRunning = false;
                                }, 2000);
                            }
                        }, swimWait);
                    }
                    setTimeout(nextStep, 600);
                }, 1000);
            }, 2000);
        }, 2000);
    }, 1500);
}

})();
