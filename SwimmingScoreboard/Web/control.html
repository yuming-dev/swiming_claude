<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>显示控制</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: #1e293b; color: #f8fafc; padding: 20px; }
h1 { text-align: center; margin-bottom: 20px; font-size: 20px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 600px; margin: 0 auto; }
.btn { padding: 20px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
.btn:hover { transform: scale(1.02); }
.btn:active { transform: scale(0.98); }
.btn-live { background: #22c55e; color: white; }
.btn-start { background: #3b82f6; color: white; }
.btn-result { background: #8b5cf6; color: white; }
.btn-rank { background: #f59e0b; color: #000; }
.btn-team { background: #06b6d4; color: white; }
.btn-award { background: #ec4899; color: white; }
.btn-record { background: #ef4444; color: white; }
.btn-welcome { background: #64748b; color: white; }
.btn-pause { background: #475569; color: white; }
.btn-list { background: #14b8a6; color: white; }
.btn-promo { background: #a855f7; color: white; }
.status { text-align: center; margin-top: 16px; font-size: 13px; color: #94a3b8; }
.conn-bar { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; font-size: 13px; }
.conn-bar .conn-text { font-weight: bold; }
.conn-bar input { padding: 4px 8px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 4px; font-size: 12px; width: 160px; outline: none; }
.conn-bar button { padding: 4px 12px; background: #3B82F6; color: white; border: none; border-radius: 3px; font-size: 12px; cursor: pointer; }
.conn-bar button.gray { background: #64748B; }
.conn-bar button.green { background: #22C55E; }
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px;">
    <h1 style="margin:0;">显示模式控制</h1>
    <!-- 右上角：连接主服务器栏 + 全屏按钮 -->
    <div style="display:flex;align-items:center;gap:10px;">
        <div class="conn-bar" id="connBar" style="margin:0;">
            <span class="conn-text" id="connStatus" style="color:#EF4444;">未连接</span>
            <span style="color:#94a3b8;">服务器:</span>
            <input id="serverHostInput" type="text" placeholder="如 192.168.1.100" autocomplete="off"/>
            <button class="green" onclick="manualConnect()">连接</button>
        </div>
        <button class="fullscreen-btn" onclick="goFullScreen()" style="padding:6px 14px;background:#3B82F6;color:white;border:none;border-radius:6px;font-size:13px;cursor:pointer;">全屏</button>
    </div>
</div>
<div class="grid">
    <button class="btn btn-live" onclick="send('SHOW_LIVE_RACE')">比赛视图</button>
    <button class="btn btn-start" onclick="send('SHOW_START_LIST')">出发表</button>
    <button class="btn btn-result" onclick="send('SHOW_HEAT_RESULT')">组成绩</button>
    <button class="btn btn-rank" onclick="send('SHOW_EVENT_RANKING')">总排名</button>
    <button class="btn btn-team" onclick="send('SHOW_TEAM_STANDINGS')">团体积分</button>
    <button class="btn btn-award" onclick="send('SHOW_AWARDS')">颁奖典礼</button>
    <button class="btn btn-record" onclick="send('SHOW_RECORDS')">纪录榜</button>
    <button class="btn btn-list" onclick="send('SHOW_EVENT_LIST')">赛程表</button>
    <button class="btn btn-promo" onclick="send('SHOW_PROMOTION_LIST')">晋级名单</button>
    <button class="btn btn-welcome" onclick="send('SHOW_WELCOME')">欢迎画面</button>
    <button class="btn btn-pause" onclick="send('SHOW_PAUSE')">暂停画面</button>
    <button class="btn" style="background:#F59E0B;color:#000;grid-column:span 3;" onclick="openPublishDialog()">成绩发布（选择已完赛项目发布到大屏）</button>
    <!-- 2026-06-01 远程控制大屏样式: 底色 / 字号 / 9 处文字颜色字体 -->
    <button class="btn" style="background:#0ea5e9;color:white;grid-column:span 3;" onclick="openDisplayStyleDialog()">🎨 大屏样式 (底色 / 字号 / 文字)</button>
</div>
<div class="status" id="status"></div>

<!-- 成绩发布弹窗 -->
<div id="publishModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:100;">
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#1e293b;border-radius:12px;padding:20px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;">
        <h2 style="margin-bottom:12px;font-size:18px;color:#F59E0B;">成绩发布到大屏</h2>
        <p style="margin-bottom:8px;font-size:13px;color:#94a3b8;">选择已完赛的比赛项目：</p>
        <div id="publishList" style="max-height:50vh;overflow-y:auto;"></div>
        <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end;">
            <button class="btn" style="background:#64748b;color:white;padding:10px 20px;" onclick="closePublishDialog()">关闭</button>
        </div>
    </div>
</div>

<!-- 2026-06-01 大屏样式远程控制弹窗 -->
<div id="displayStyleModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:100;">
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#1e293b;border-radius:12px;padding:20px;width:95%;max-width:640px;max-height:90vh;overflow-y:auto;color:#f8fafc;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h2 style="font-size:18px;color:#0ea5e9;">🎨 大屏样式远程控制</h2>
            <button onclick="closeDisplayStyleDialog()" style="background:none;border:none;color:#94a3b8;font-size:22px;cursor:pointer;">×</button>
        </div>
        <p style="font-size:12px;color:#94a3b8;margin-bottom:10px;">改动立刻推送到所有大屏 display.html, 服务器持久化保存.</p>

        <!-- 底色 -->
        <div style="margin-bottom:14px;padding:10px;background:#0f172a;border-radius:8px;border:1px solid #334155;">
            <div style="font-weight:bold;color:#0ea5e9;margin-bottom:6px;">底色</div>
            <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
                <input id="cs_bgPicker" type="color" value="#0f172a" onchange="cs_setBg(this.value)" style="width:36px;height:30px;padding:0;border:1px solid #334155;border-radius:4px;background:transparent;cursor:pointer;"/>
                <input id="cs_bgHex" type="text" maxlength="60" placeholder="#0f172a 或 linear-gradient(...)" onchange="cs_setBg(this.value)" style="flex:1;padding:4px 8px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;font-family:Consolas,monospace;font-size:12px;"/>
            </div>
            <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:4px;">
                <div onclick="cs_setBg('#0f172a')" title="深邃蓝" style="height:28px;border-radius:4px;cursor:pointer;background:#0f172a;border:1px solid #334155;"></div>
                <div onclick="cs_setBg('#0c4a6e')" title="泳池青" style="height:28px;border-radius:4px;cursor:pointer;background:#0c4a6e;border:1px solid #334155;"></div>
                <div onclick="cs_setBg('#082f49')" title="深海蓝" style="height:28px;border-radius:4px;cursor:pointer;background:#082f49;border:1px solid #334155;"></div>
                <div onclick="cs_setBg('#14532d')" title="森林绿" style="height:28px;border-radius:4px;cursor:pointer;background:#14532d;border:1px solid #334155;"></div>
                <div onclick="cs_setBg('#312e81')" title="紫罗兰" style="height:28px;border-radius:4px;cursor:pointer;background:#312e81;border:1px solid #334155;"></div>
                <div onclick="cs_setBg('#0a0a0a')" title="炭墨黑" style="height:28px;border-radius:4px;cursor:pointer;background:#0a0a0a;border:1px solid #334155;"></div>
                <div onclick="cs_setBg('linear-gradient(180deg, #082f49 0%, #0284c7 70%, #38bdf8 100%)')" title="深海到天空" style="height:28px;border-radius:4px;cursor:pointer;background:linear-gradient(180deg, #082f49 0%, #0284c7 70%, #38bdf8 100%);border:1px solid #334155;"></div>
                <div onclick="cs_setBg('linear-gradient(180deg, #581c87 0%, #be123c 55%, #f59e0b 100%)')" title="落日余晖" style="height:28px;border-radius:4px;cursor:pointer;background:linear-gradient(180deg, #581c87 0%, #be123c 55%, #f59e0b 100%);border:1px solid #334155;"></div>
            </div>
        </div>

        <!-- 字号 -->
        <div style="margin-bottom:14px;padding:10px;background:#0f172a;border-radius:8px;border:1px solid #334155;">
            <div style="font-weight:bold;color:#0ea5e9;margin-bottom:6px;">字号 (0.8x ~ 3.0x)</div>
            <div style="display:flex;align-items:center;gap:10px;">
                <button onclick="cs_bumpFs(-0.1)" style="padding:6px 14px;background:#475569;color:#f8fafc;border:none;border-radius:4px;cursor:pointer;font-size:16px;font-weight:bold;">−</button>
                <div id="cs_fsLabel" style="flex:1;text-align:center;font-size:20px;font-weight:bold;color:#f59e0b;font-family:Consolas,monospace;">1.0x</div>
                <button onclick="cs_bumpFs(0.1)" style="padding:6px 14px;background:#475569;color:#f8fafc;border:none;border-radius:4px;cursor:pointer;font-size:16px;font-weight:bold;">+</button>
                <button onclick="cs_setFs(1.0)" style="padding:6px 12px;background:#64748b;color:#f8fafc;border:none;border-radius:4px;cursor:pointer;font-size:12px;">复位</button>
            </div>
        </div>

        <!-- 9 处文字 -->
        <div style="padding:10px;background:#0f172a;border-radius:8px;border:1px solid #334155;">
            <div style="font-weight:bold;color:#0ea5e9;margin-bottom:6px;">文字颜色 / 字体</div>
            <div id="cs_textStyleRows"></div>
        </div>
    </div>
</div>

<script>
var ws, serverData = {};
window.onbeforeunload = function(e) { e.preventDefault(); e.returnValue = ''; return '确定要关闭显示控制？'; };

function goFullScreen() { var el=document.documentElement; if(document.fullscreenElement)return; if(el.requestFullscreen)el.requestFullscreen(); else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen(); else if(el.msRequestFullscreen)el.msRequestFullscreen(); }
document.addEventListener('fullscreenchange', function() { var btns=document.querySelectorAll('.fullscreen-btn'); for(var i=0;i<btns.length;i++) btns[i].style.display=document.fullscreenElement?'none':''; });
document.addEventListener('webkitfullscreenchange', function() { var btns=document.querySelectorAll('.fullscreen-btn'); for(var i=0;i<btns.length;i++) btns[i].style.display=document.webkitFullscreenElement?'none':''; });


var _connFailCount = 0;
function getServerHost(forceAsk) {
    var params = new URLSearchParams(window.location.search);
    if (params.get('host')) return params.get('host');
    if (!forceAsk && location.hostname && location.hostname !== '' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return location.hostname;
    var saved = localStorage.getItem('swimServerHost');
    if (!forceAsk && saved) return saved;
    var def = saved || '192.168.1.100';
    var ip = prompt('请输入服务器IP地址:', def);
    if (ip) { localStorage.setItem('swimServerHost', ip); return ip; }
    return saved || 'localhost';
}
function setConnUI(text, color) {
    var s = document.getElementById('connStatus');
    if (s) { s.textContent = text; s.style.color = color || '#EF4444'; }
}
function manualConnect() {
    var inp = document.getElementById('serverHostInput');
    var ip = inp ? inp.value.trim() : '';
    if (!ip) { setConnUI('请输入服务器IP', '#EF4444'); return; }
    localStorage.setItem('swimServerHost', ip);
    _connFailCount = 0;
    if (ws) try { ws.close(); } catch(e) {}
    setConnUI('连接中…', '#F59E0B');
    connect();
}
function changeServerHost() {
    _connFailCount = 0;
    var h = getServerHost(true);
    var inp = document.getElementById('serverHostInput');
    if (inp) inp.value = h;
    if (ws) try { ws.close(); } catch(e) {}
    setConnUI('连接中…', '#F59E0B');
    connect();
}
function connect() {
    var host = getServerHost();
    var inp = document.getElementById('serverHostInput');
    if (inp && !inp.value) inp.value = host;
    ws = new WebSocket('ws://' + host + ':3002');
    ws.onopen = function() {
        _connFailCount = 0;
        setConnUI('已连接', '#22C55E');
        ws.send(JSON.stringify({type: 'REMOTE_CONTROL', command: 'SHOW_LIVE_RACE'}));
    };
    ws.onclose = function() {
        setConnUI('连接断开，重连中…', '#EF4444');
        _connFailCount++;
        if (_connFailCount >= 3) { _connFailCount = 0; if (confirm('连接失败，是否重新设置服务器地址？')) { changeServerHost(); return; } }
        setTimeout(connect, 3000);
    };
    ws.onerror = function() {
        setConnUI('连接错误，请检查服务器IP', '#EF4444');
    };
    ws.onmessage = function(e) {
        try {
            var msg = JSON.parse(e.data);
            // 2026-06-01 大屏样式推送 → 同步 UI
            if (msg.type === 'DISPLAY_STYLE_PUSH') { _cs_applyToUi(msg.data || {}); return; }
            // 只更新含赛程数据的广播消息，跳过晋级通知等特殊消息
            if (msg.data && msg.data.schedule) serverData = msg.data;
        } catch(ex) {}
    };
}
function send(cmd) {
    if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({type: 'REMOTE_CONTROL', command: cmd}));
        document.getElementById('status').textContent = '已发送: ' + cmd;
    }
}

// ═══════ 2026-06-01 大屏样式远程控制 ═══════
// 改动通过 SET_DISPLAY_STYLE 推给服务器, 服务器持久化 + 广播 DISPLAY_STYLE_PUSH 给所有客户端
var CS_TEXT_KEYS = [
    {k:'title',  label:'比赛名称', dC:'#f8fafc', dF:"'Microsoft YaHei', sans-serif"},
    {k:'event',  label:'比赛项目', dC:'#f8fafc', dF:"'Microsoft YaHei', sans-serif"},
    {k:'time',   label:'滚动时间', dC:'#f59e0b', dF:"'Consolas', monospace"},
    {k:'lane',   label:'道次',     dC:'#94a3b8', dF:"'Microsoft YaHei', sans-serif"},
    {k:'rank',   label:'名次',     dC:'#f8fafc', dF:"'Microsoft YaHei', sans-serif"},
    {k:'name',   label:'姓名',     dC:'#f8fafc', dF:"'Microsoft YaHei', sans-serif"},
    {k:'team',   label:'代表队',   dC:'#94a3b8', dF:"'Microsoft YaHei', sans-serif"},
    {k:'result', label:'成绩',     dC:'#f8fafc', dF:"'Consolas', monospace"},
    {k:'remark', label:'备注',     dC:'#ef4444', dF:"'Microsoft YaHei', sans-serif"}
];
var CS_FONT_OPTIONS = [
    {label:'微软雅黑', value:"'Microsoft YaHei', sans-serif"},
    {label:'黑体',     value:"SimHei, sans-serif"},
    {label:'宋体',     value:"SimSun, serif"},
    {label:'楷体',     value:"KaiTi, serif"},
    {label:'仿宋',     value:"FangSong, serif"},
    {label:'隶书',     value:"LiSu, serif"},
    {label:'幼圆',     value:"YouYuan, sans-serif"},
    {label:'Arial',    value:"Arial, sans-serif"},
    {label:'Consolas (等宽)', value:"Consolas, monospace"},
    {label:'Impact',   value:"Impact, sans-serif"}
];
var _cs_currentStyle = { bg:'#0f172a', fs:1.0, textStyle:{} };

function _cs_sendStyle(payload) {
    if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'SET_DISPLAY_STYLE', data: payload }));
    }
}
function cs_setBg(v) {
    if (!v) return;
    _cs_currentStyle.bg = v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) document.getElementById('cs_bgPicker').value = v;
    document.getElementById('cs_bgHex').value = v;
    _cs_sendStyle({ bg: v });
}
function cs_clampFs(v) { v = Math.round(v * 10) / 10; return Math.max(0.8, Math.min(3.0, v)); }
function cs_setFs(v) {
    v = cs_clampFs(v);
    _cs_currentStyle.fs = v;
    document.getElementById('cs_fsLabel').textContent = v.toFixed(1) + 'x';
    _cs_sendStyle({ fs: v });
}
function cs_bumpFs(d) { cs_setFs((_cs_currentStyle.fs || 1.0) + d); }

function cs_setTextColor(k, c) {
    if (!/^#[0-9a-fA-F]{6}$/.test(c)) return;
    if (!_cs_currentStyle.textStyle[k]) _cs_currentStyle.textStyle[k] = {};
    _cs_currentStyle.textStyle[k].c = c;
    var add = {}; add[k] = { c: c };
    _cs_sendStyle({ textStyle: add, textStyleMerge: true });
}
function cs_setTextFont(k, f) {
    if (!f) return;
    if (!_cs_currentStyle.textStyle[k]) _cs_currentStyle.textStyle[k] = {};
    _cs_currentStyle.textStyle[k].f = f;
    var add = {}; add[k] = { f: f };
    _cs_sendStyle({ textStyle: add, textStyleMerge: true });
}
function cs_resetText(k) {
    var def = null;
    for (var i = 0; i < CS_TEXT_KEYS.length; i++) if (CS_TEXT_KEYS[i].k === k) { def = CS_TEXT_KEYS[i]; break; }
    if (!def) return;
    cs_setTextColor(k, def.dC);
    cs_setTextFont(k, def.dF);
    _cs_buildTextRows();   // 重画 UI 同步默认值
}

function _cs_buildTextRows() {
    var host = document.getElementById('cs_textStyleRows');
    if (!host) return;
    var html = '';
    for (var i = 0; i < CS_TEXT_KEYS.length; i++) {
        var def = CS_TEXT_KEYS[i];
        var saved = (_cs_currentStyle.textStyle || {})[def.k] || {};
        var c = saved.c || def.dC;
        var f = saved.f || def.dF;
        var fontOpts = '';
        var matched = false;
        for (var j = 0; j < CS_FONT_OPTIONS.length; j++) {
            var fo = CS_FONT_OPTIONS[j];
            var sel = (fo.value === f) ? ' selected' : '';
            if (sel) matched = true;
            fontOpts += '<option value="' + fo.value.replace(/"/g,'&quot;') + '"' + sel + '>' + fo.label + '</option>';
        }
        if (!matched) fontOpts = '<option value="' + f.replace(/"/g,'&quot;') + '" selected>自定义</option>' + fontOpts;
        html +=
            '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;padding:4px 0;border-bottom:1px solid #334155;">' +
                '<span style="flex:0 0 70px;color:#cbd5e1;font-size:12px;">' + def.label + '</span>' +
                '<input type="color" value="' + (/^#[0-9a-fA-F]{6}$/.test(c)?c:'#f8fafc') + '" onchange="cs_setTextColor(\'' + def.k + '\', this.value)" style="flex:0 0 32px;height:24px;padding:0;border:1px solid #334155;border-radius:4px;background:transparent;cursor:pointer;"/>' +
                '<input type="text" maxlength="7" value="' + c + '" onchange="cs_setTextColor(\'' + def.k + '\', this.value)" style="flex:0 0 70px;padding:3px 4px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;font-family:Consolas,monospace;font-size:11px;text-align:center;"/>' +
                '<select onchange="cs_setTextFont(\'' + def.k + '\', this.value)" style="flex:1;min-width:0;padding:3px 4px;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:4px;font-size:12px;cursor:pointer;">' + fontOpts + '</select>' +
                '<button onclick="cs_resetText(\'' + def.k + '\')" title="复位" style="flex:0 0 28px;height:24px;background:#334155;color:#cbd5e1;border:none;border-radius:4px;cursor:pointer;font-size:13px;">↺</button>' +
            '</div>';
    }
    host.innerHTML = html;
}

function _cs_applyToUi(data) {
    if (!data) return;
    if (typeof data.bg === 'string' && data.bg) {
        _cs_currentStyle.bg = data.bg;
        if (/^#[0-9a-fA-F]{6}$/.test(data.bg)) {
            try { document.getElementById('cs_bgPicker').value = data.bg; } catch(e) {}
        }
        try { document.getElementById('cs_bgHex').value = data.bg; } catch(e) {}
    }
    if (typeof data.fs === 'number' && data.fs > 0) {
        _cs_currentStyle.fs = data.fs;
        try { document.getElementById('cs_fsLabel').textContent = data.fs.toFixed(1) + 'x'; } catch(e) {}
    }
    if (data.textStyle && typeof data.textStyle === 'object') {
        _cs_currentStyle.textStyle = data.textStyle;
        _cs_buildTextRows();
    }
}

function openDisplayStyleDialog() {
    document.getElementById('displayStyleModal').style.display = 'block';
    _cs_buildTextRows();
    // 主动拉一次当前值, 防止旧 UI 状态
    if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'GET_DISPLAY_STYLE' }));
    }
}
function closeDisplayStyleDialog() {
    document.getElementById('displayStyleModal').style.display = 'none';
}

function openPublishDialog() {
    var schedule = serverData.schedule || [];
    if (schedule.length === 0) {
        alert('暂未收到服务器赛程数据，请稍后再试。\n（如果刚连接，请等待几秒后重试）');
        return;
    }
    var listEl = document.getElementById('publishList');
    var html = '';
    var found = 0;

    for (var i = 0; i < schedule.length; i++) {
        var s = schedule[i];
        var hc = s.heatCount || 1;
        var heatConfirmed = s.heatConfirmed || [];
        for (var h = 0; h < hc; h++) {
            if (heatConfirmed[h] !== true) continue;
            found++;
            var showHeat = (hc > 1) || (s.stage && (s.stage.indexOf('预赛') >= 0 || s.stage.indexOf('半决赛') >= 0));
            var heatLabel = showHeat ? ' 第' + (h+1) + '组' : '';
            var label = (s.gender||'') + ' ' + (s.eventName||'') + ' ' + (s.stage||'') + heatLabel;
            var btnId = 'pub_' + i + '_' + h;
            html += '<button id="' + btnId + '" style="display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:4px;' +
                'background:#334155;color:white;border:none;border-radius:6px;font-size:14px;cursor:pointer;" ' +
                'onclick="publishResult(\'' + (s.gender||'').replace(/'/g,"\\'") + '\',\'' + (s.eventName||'').replace(/'/g,"\\'") + '\',\'' +
                (s.stage||'').replace(/'/g,"\\'") + '\',' + (h+1) + ',' + hc + ')">' +
                label + '</button>';
        }
    }

    if (found === 0) {
        html = '<p style="color:#94a3b8;padding:20px;text-align:center;">暂无已完赛的比赛项目</p>';
    }
    listEl.innerHTML = html;
    document.getElementById('publishModal').style.display = 'block';
}

function closePublishDialog() {
    document.getElementById('publishModal').style.display = 'none';
}

function publishResult(gender, eventName, stage, heat, heatCount) {
    if (!confirm('确定发布 ' + gender + ' ' + eventName + ' ' + stage + (heatCount > 1 ? ' 第'+heat+'组' : '') + ' 的成绩到大屏？')) return;

    // 从serverData中构建该组成绩
    var swimmers = [];
    var allSwimmers = serverData.swimmers || [];
    // 注意：serverData.swimmers只有当前组的运动员，无法获取历史组
    // 需要通过服务器来发布，发送命令让服务器构建数据
    if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
            type: 'TIMING_CMD',
            command: 'PUBLISH_RESULT',
            data: { gender: gender, eventName: eventName, stage: stage, heat: heat }
        }));
        document.getElementById('status').textContent = '已请求发布: ' + gender + ' ' + eventName + ' ' + stage;
    }
    closePublishDialog();
}

// 启动：先把已知/默认的服务器IP填入连接栏输入框，并触发一次连接尝试
(function bootstrap() {
    var inp = document.getElementById('serverHostInput');
    if (inp) {
        inp.value = getServerHost();
        inp.addEventListener('keydown', function(ev) { if (ev.key === 'Enter') manualConnect(); });
    }
    setConnUI('连接中…', '#F59E0B');
    connect();
})();
</script>
