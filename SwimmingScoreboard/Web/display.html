<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<title>大屏幕</title>
<style>
:root {
    --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --dim: #94a3b8;
    --gold: #f59e0b; --accent: #3b82f6; --red: #ef4444; --green: #22c55e;
    /* 2026-05-31 大屏字号缩放: localStorage('swimDisplayFs') 持久化; UI/快捷键 Ctrl+/- 调节 */
    --fs: 1;
    /* 2026-06-02 字号 4 类独立缩放 (比赛名称 / 比赛项目 / 比赛时间 / 运动员信息),
       与全局 --fs 相乘. localStorage('swimDisplayFsParts') 持久化为 {title,event,time,info}. */
    --fs-title: 1; --fs-event: 1; --fs-time: 1; --fs-info: 1;
    /* 2026-06-04 第 3 行 表头 单独可调字号 (与 运动员信息 解耦), localStorage('swimDisplayFsParts') 同源 */
    --fs-header: 1;
    /* 2026-06-01 文字 颜色 + 字体单独可调; localStorage('swimDisplayTextStyle') 持久化为 {key:{c,f}} JSON
       2026-06-02 加 stage (赛次/组别) + header (表头) 两个独立可调项, 共 11 处 */
    --c-title: #f8fafc;    --ff-title: 'Microsoft YaHei', sans-serif;
    --c-event: #f8fafc;    --ff-event: 'Microsoft YaHei', sans-serif;
    --c-stage: #94a3b8;    --ff-stage: 'Microsoft YaHei', sans-serif;
    --c-time:  #f59e0b;    --ff-time:  'Consolas', monospace;
    --c-header:#94a3b8;    --ff-header:'Microsoft YaHei', sans-serif;
    --c-lane:  #94a3b8;    --ff-lane:  'Microsoft YaHei', sans-serif;
    --c-rank:  #f8fafc;    --ff-rank:  'Microsoft YaHei', sans-serif;
    --c-name:  #f8fafc;    --ff-name:  'Microsoft YaHei', sans-serif;
    --c-team:  #94a3b8;    --ff-team:  'Microsoft YaHei', sans-serif;
    --c-result:#f8fafc;    --ff-result:'Consolas', monospace;
    --c-remark:#ef4444;    --ff-remark:'Microsoft YaHei', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Microsoft YaHei', sans-serif; overflow: hidden; height: 100vh; }

/* 2026-06-03 取消顶栏黑色渐变, 改用页面底色透出 (与其它区域一致); 高度加到 13vh 给 标题/项目名/表头 留更宽松的呼吸空间 */
.page-header {
    height: 13vh; display: flex; align-items: center; justify-content: center;
    padding: 0 3vw; position: relative;
    background: transparent;
}
.page-header .title { font-size: calc(3.5vh * var(--fs) * var(--fs-title)); font-weight: bold; color: var(--c-title); font-family: var(--ff-title); }
.header-records { position: absolute; right: 3vw; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: flex-end; gap: 0.3vh; }
.record-item { font-size: calc(2.6vh * var(--fs) * var(--fs-info)); font-family: 'Consolas', monospace; color: var(--dim); }
.rec-label { color: var(--gold); font-weight: bold; margin-right: 0.5vw; }

/* 比赛视图 - 2026-06-03 page-header 加到 13vh 后, race-view 跟着减到 87vh, 总高仍 100vh */
.race-view { height: 87vh; padding: 1vh 2vw; display: flex; flex-direction: column; }
.race-info { display: flex; justify-content: space-between; align-items: center; height: 6vh; margin-bottom: 0.5vh; border-bottom: 3px solid var(--accent); padding-bottom: 0.5vh; }
/* 2026-06-02 lanes-header 用 --c-header / --ff-header (可独立调) + --fs-info 字号
   2026-06-04 整个第三行 (表头) 用 --fs-header 控: 字号 + 行高 + 内边距 都跟着缩放,
              表头单一行不存在 "10 行越界" 问题, 行高放大就放大. */
.lanes-header { display: flex; align-items: center; padding: 0 1.5vw; height: calc(3.5vh * var(--fs-header)); color: var(--c-header); font-family: var(--ff-header); font-size: calc(2.9vh * var(--fs) * var(--fs-header)); }
.race-info .event-left { display: flex; align-items: baseline; gap: 1.5vw; }
.race-info .event-name { font-size: calc(2.8vh * var(--fs) * var(--fs-event)); font-weight: bold; color: var(--c-event); font-family: var(--ff-event); }
/* 2026-06-02 赛次/组别 用 --c-stage / --ff-stage (可独立调), 字号跟随 比赛项目 */
.race-info .stage-heat { font-size: calc(2.8vh * var(--fs) * var(--fs-event)); color: var(--c-stage); font-family: var(--ff-stage); }
/* 2026-06-05 项目名称下 一行 显示 本项目所有组别 纪录 (横排空格分隔, "省R12-13岁 25.88" 等) */
.applicable-records { display: flex; flex-wrap: wrap; gap: 1.6vw 2.4vw; padding: 0.4vh 0.5vw; margin-bottom: 0.5vh;
    font-size: calc(1.6vh * var(--fs) * var(--fs-info)); color: #FBBF24; font-family: var(--ff-info); font-weight: bold;
    border-bottom: 1px dashed rgba(251,191,36,0.4); }
.applicable-records .ar-item { white-space: nowrap; }
.applicable-records .ar-tag { color: #FCD34D; margin-right: 0.3vw; }
.applicable-records .ar-time { color: #FEF3C7; font-family: 'Consolas', monospace; }
.race-info .running-time { font-size: calc(4vh * var(--fs) * var(--fs-time)); font-weight: bold; color: var(--c-time); font-family: var(--ff-time); }

.lanes-container { flex: 1; display: flex; flex-direction: column; gap: 0; }
/* 2026-05-31 取消每道卡片底色, 改用细横线分隔 (与总排名 list-table 一致), 让大屏底色/背景图直接透出来 */
.lane-row {
    flex: 1; display: flex; align-items: center; background: transparent;
    padding: 0 1.5vw; position: relative; overflow: hidden; min-height: 0;
    border-bottom: 1px solid #334155;
}
.lane-row.finished { border-bottom-color: var(--green); }
/* 2026-06-04 DNS / DSQ / TRI 同款显示 (红色下边框) */
.lane-row.dns,
.lane-row.dsq,
.lane-row.tri { border-bottom-color: var(--red); }
/* 2026-05-27 空道(本组无运动员): 半透明显示, 保留道次号让屏幕道数齐整 */
.lane-row.empty { opacity: 0.28; }
/* 2026-05-31 列宽改 flex 比例自动撑满整行 (原 vw 固定宽度只能覆盖 ~60% 屏宽).
   2026-06-04 加 '组别' 列 (区分并组中 不同 AgeCategory), 7 列重新调比例
   比例: 个人项 4 : 4 : 11 : 9 : 8 : 13 : 7 (道/名次/姓名/代表队/组别/成绩/备注)
        接力项 4 : 4 : 6(代表队窄) : 28(姓名宽 同列 4 棒) : 8 : 13 : 7 */
.lane-row .lane-num { flex: 4; min-width: 0; font-size: calc(2.5vh * var(--fs) * var(--fs-info)); font-weight: bold; color: var(--c-lane); font-family: var(--ff-lane); text-align: center; margin-right: 1vw; }
.lane-row .swimmer-name { flex: 11; min-width: 0; font-size: calc(2.9vh * var(--fs) * var(--fs-info)); font-weight: bold; color: var(--c-name); font-family: var(--ff-name); white-space: nowrap; overflow: hidden; margin-right: 1vw; text-align: center; }
.lane-row .swimmer-team { flex: 9; min-width: 0; font-size: calc(2.9vh * var(--fs) * var(--fs-info)); color: var(--c-team); font-family: var(--ff-team); white-space: nowrap; overflow: hidden; margin-right: 1vw; text-align: center; }
/* 2026-06-04 组别列: 字号略小 (2.4vh, "9-11岁组" 也能放下), 用 --c-team / --ff-team (可独立调) */
.lane-row .age-group { flex: 8; min-width: 0; font-size: calc(2.4vh * var(--fs) * var(--fs-info)); color: var(--c-team); font-family: var(--ff-team); white-space: nowrap; overflow: hidden; margin-right: 1vw; text-align: center; }
.lane-row .result-time { flex: 13; min-width: 0; font-size: calc(2.9vh * var(--fs) * var(--fs-info)); font-weight: bold; text-align: center; color: var(--c-result); font-family: var(--ff-result); margin-right: 1vw; }
.lane-row .rank { flex: 4; min-width: 0; font-size: calc(2.9vh * var(--fs) * var(--fs-info)); font-weight: bold; text-align: center; color: var(--c-rank); font-family: var(--ff-rank); margin-right: 1vw; }
/* 2026-06-04 1/2/3 名 不再用 金/银/铜 色, 与 4+ 同色 (= var(--c-rank)).
   .gold/.silver/.bronze class 仍由 JS 写入, 但 CSS 这里强制覆盖为统一色 */
.lane-row .rank.gold,
.lane-row .rank.silver,
.lane-row .rank.bronze { color: var(--c-rank); }
.lane-row .remark { flex: 7; min-width: 0; font-size: calc(2.9vh * var(--fs) * var(--fs-info)); color: var(--c-remark); font-family: var(--ff-remark); text-align: center; }

/* 比赛视图列序 (= flex order):
   个人项: 道次 → 名次 → 姓名 → 代表队 → 组别 → 成绩 → 备注
   接力项: 道次 → 名次 → 代表队(窄) → 姓名(宽, 4 棒名同列) → 组别 → 成绩 → 备注 */
.lane-row .lane-num     { order: 1; }
.lane-row .rank         { order: 2; }
.lane-row .swimmer-name { order: 3; }
.lane-row .swimmer-team { order: 4; }
.lane-row .age-group    { order: 5; }
.lane-row .result-time  { order: 6; }
.lane-row .remark       { order: 7; }
.lane-row.relay .swimmer-name { flex: 6; }   /* relay 时 swimmer-name DOM 实际承载代表队 (窄) */
.lane-row.relay .swimmer-team { flex: 28; white-space: normal; line-height: 1.25; text-align: center; }   /* relay 时 swimmer-team DOM 承载 4 棒+姓名, 居中 */

/* 2026-06-06 组排名 行高/间距 与 比赛视图 .lane-row (flex:1) 完全一致, 不再固定 7.5vh.
   原 7.5vh 是为了在少人比赛时避免行拉太高, 但导致 组排名 视觉上与 比赛视图 不一致 (行更挤).
   现 flex:1 撑满容器, 10 行平均分配. 超过 10 行 仍 renderHeatResult 自动翻页. */
.lane-row.fixed-row { flex: 1; min-height: 0; }

/* 列表视图 - 2026-06-03 page-header 加到 13vh 后, list-container 跟着减到 87vh
   2026-06-03 padding-top 2vh → 1vh (= .race-view 同款), 让 总排名 row1↔row2 间距 = 比赛视图 */
.list-container { height: 87vh; padding: 1vh 3vw; overflow: hidden; position: relative; }
.page-indicator { position: absolute; bottom: 1vh; right: 3vw; font-size: calc(1.8vh * var(--fs)); color: var(--dim); }
/* 2026-06-02 总排名 / 出发表 / 团体 / 纪录 表格: 行高固定不随字号膨胀.
   原 padding 1.5vh*2 + font-size 3vh = ~6.3vh; 字号 2x/3x 后行高翻倍, 10 行越界
   89vh 容器导致底部丢失. 现在固定 height: 7vh + line-height: 1 — 字号在格内贴边
   放大 (与比赛视图 .lane-row + .fixed-row 一致), 行数稳定. */
.list-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
/* 2026-06-03 总排名 表格参数与 比赛视图 / 组成绩 (.lane-row + .fixed-row + .lanes-header) 完全对齐:
   - th font-size 2.9vh + height 3.5vh (= .lanes-header 同款)
   - td font-size 2.9vh + height 7.5vh (= .lane-row.fixed-row 同款)
   - padding 0 1.5vw (= .lane-row 同款)
   - text-align center
   高度 固定不随 --fs-info 缩放: 与 比赛视图 .lane-row flex:1 等价行为, 字号放大时只是文字溢出,
   10 行 永远 10 行 (之前 height * fs-info 导致 字号 1.2x 时 总排名/组成绩 只能装 9 行) */
.list-table th {
    background: transparent; padding: 0 1.5vw; text-align: center;
    /* 2026-06-04 表头字号 + 行高 都用 --fs-header (整个第 3 行 单独调; 表头单一行无 '10 行越界' 问题) */
    font-size: calc(2.9vh * var(--fs) * var(--fs-header)); border-bottom: 2px solid var(--accent);
    color: var(--c-header); font-family: var(--ff-header);
    height: calc(3.5vh * var(--fs-header)); line-height: 1; overflow: hidden; white-space: nowrap;
}
.list-table td {
    padding: 0 1.5vw; font-size: calc(2.9vh * var(--fs) * var(--fs-info)); text-align: center;
    border-bottom: 1px solid #334155;
    height: 7.5vh; line-height: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
/* 2026-06-03 每列 td 对应 比赛视图 同款颜色/字体 (运动员管理→文字样式 改一处, 比赛视图+组成绩+总排名 三处同步生效)
   show* 函数在 td 上加 class="t-rank"/"t-lane"/"t-name"/"t-team"/"t-result"/"t-remark"
   字号: t-lane 用 2.5vh (= .lane-num 同款 比赛视图道次紧凑); 其它列用 td 默认 2.9vh */
.list-table td.t-rank   { color: var(--c-rank);   font-family: var(--ff-rank);   font-weight: bold; }
.list-table td.t-lane   { color: var(--c-lane);   font-family: var(--ff-lane);   font-weight: bold; font-size: calc(2.5vh * var(--fs) * var(--fs-info)); }
.list-table td.t-name   { color: var(--c-name);   font-family: var(--ff-name);   font-weight: bold; }
.list-table td.t-team   { color: var(--c-team);   font-family: var(--ff-team); }
.list-table td.t-result { color: var(--c-result); font-family: var(--ff-result); font-weight: bold; }
.list-table td.t-remark { color: var(--c-remark); font-family: var(--ff-remark); }
/* 2026-06-04 总排名 1/2/3 名 不再金银铜, 与 4+ 同色 (= var(--c-rank)).
   class 仍由 JS 写入, CSS 这里覆盖颜色为统一色 */
.list-table td.t-rank.gold,
.list-table td.t-rank.silver,
.list-table td.t-rank.bronze { color: var(--c-rank); }
.list-table tr:hover { background: rgba(59,130,246,0.1); }

/* 欢迎画面 — 2026-06-02 文字内容居中显示 (text-align:center): 长比赛名换行时居中, 而不是默认 left */
.center-msg { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 6vw; }
.hero-text { font-size: calc(6vh * var(--fs) * var(--fs-title)); font-weight: bold; margin-bottom: 2vh; color: var(--c-title); font-family: var(--ff-title); text-align: center; }
.sub-text { font-size: calc(3vh * var(--fs) * var(--fs-event)); color: var(--dim); text-align: center; }

/* 颁奖 */
.award-container { height: 87vh; display: flex; align-items: flex-end; justify-content: center; gap: 3vw; padding-bottom: 5vh; }
.podium-card { display: flex; flex-direction: column; align-items: center; padding: 3vh 2vw; border-radius: 1vh; animation: reveal 0.8s ease-out forwards; opacity: 0; }
.podium-card.gold { background: linear-gradient(180deg, #f59e0b22, #f59e0b11); border: 2px solid var(--gold); height: 55vh; animation-delay: 2.5s; }
.podium-card.silver { background: linear-gradient(180deg, #c0c0c022, #c0c0c011); border: 2px solid #c0c0c0; height: 45vh; animation-delay: 1.2s; }
.podium-card.bronze { background: linear-gradient(180deg, #cd7f3222, #cd7f3211); border: 2px solid #cd7f32; height: 40vh; animation-delay: 0.2s; }
.podium-card .medal { font-size: calc(5vh * var(--fs)); margin-bottom: 1vh; }
.podium-card .name { font-size: calc(3vh * var(--fs)); font-weight: bold; margin-bottom: 0.5vh; }
.podium-card .team { font-size: calc(2vh * var(--fs)); color: var(--dim); margin-bottom: 1vh; }
.podium-card .time { font-size: calc(2.5vh * var(--fs)); font-family: 'Consolas', monospace; }

@keyframes reveal { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.hidden { display: none; }
</style>
</head>
<body onclick="goFullScreen()">
<div class="page-header">
    <span class="title" id="compName">游泳赛事管理系统</span>
    <div class="header-records">
        <span class="record-item"><span class="rec-label" id="recordMainLabel">WR</span><span id="recordWR">-</span></span>
        <span class="record-item"><span class="rec-label">CR</span><span id="recordCR">-</span></span>
    </div>
</div>

<div id="raceView" class="race-view">
    <div class="race-info">
        <div class="event-left">
            <span class="event-name" id="eventName">-</span>
            <span class="stage-heat" id="stageHeat">-</span>
        </div>
        <div class="running-time" id="runningTime">0.0</div>
    </div>
    <!-- 2026-06-05 项目名称下 新加一行: 本项目所有组别的纪录列表 (MR/省R/CR 等) -->
    <div id="applicableRecordsRow" class="applicable-records" style="display:none;"></div>
    <!-- 2026-06-04 静态表头改 7 列 (加 组别), 与 .lane-row 同款 order/flex 比例 -->
    <div class="lanes-header">
        <div style="flex:4;min-width:0;text-align:center;margin-right:1vw;">道次</div>
        <div style="flex:4;min-width:0;text-align:center;margin-right:1vw;">名次</div>
        <div style="flex:11;min-width:0;text-align:center;margin-right:1vw;">姓名</div>
        <div style="flex:9;min-width:0;text-align:center;margin-right:1vw;">代表队</div>
        <div style="flex:8;min-width:0;text-align:center;margin-right:1vw;">组别</div>
        <div style="flex:13;min-width:0;text-align:center;margin-right:1vw;">成绩</div>
        <div style="flex:7;min-width:0;text-align:center;">备注</div>
    </div>
    <div class="lanes-container" id="lanesContainer"></div>
</div>

<div id="listView" class="list-container hidden"></div>
<div id="welcomeView" class="center-msg hidden">
    <div class="hero-text" id="welcomeTitle">欢迎</div>
    <div class="sub-text" id="welcomeSub"></div>
</div>
<div id="awardView" class="hidden">
    <div class="page-header"><span class="title" id="awardTitle">颁奖典礼</span></div>
    <div class="award-container" id="awardContainer"></div>
</div>

<!-- 媒体（图片 / 视频）全屏显示层 -->
<div id="mediaView" class="hidden" style="position:fixed;left:0;top:0;width:100vw;height:100vh;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;">
    <img id="mediaImg" style="display:none;max-width:100vw;max-height:100vh;"/>
    <video id="mediaVideo" style="display:none;max-width:100vw;max-height:100vh;background:#000;" playsinline></video>
</div>

<!-- 2026-05-27 大屏底色设置: 右下角齿轮按钮 → 弹出选色面板 (纯色/渐变/灰度/图案 4 类). 数据保存在 localStorage('swimDisplayBg'). -->
<button id="bgSettingsBtn" onclick="toggleBgSettings()" title="大屏底色设置"
        style="position:fixed;right:1.2vw;bottom:1.2vh;width:5.5vh;height:5.5vh;border-radius:50%;background:rgba(30,41,59,0.55);color:#94a3b8;border:1px solid rgba(148,163,184,0.35);font-size:2.6vh;cursor:pointer;z-index:9998;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:opacity .2s;opacity:0.45;"
        onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.45'">⚙</button>

<!-- 2026-05-31 大屏字号缩放: 字号按钮在齿轮按钮上方 (相同样式风格). LED 屏极宽极扁导致 vh 算出来字小, 这里允许 0.8x~3.0x 调节. 数据保存在 localStorage('swimDisplayFs'). -->
<button id="fsSettingsBtn" onclick="toggleFsSettings()" title="大屏字号 (Ctrl + / Ctrl -)"
        style="position:fixed;right:1.2vw;bottom:7.6vh;width:5.5vh;height:5.5vh;border-radius:50%;background:rgba(30,41,59,0.55);color:#94a3b8;border:1px solid rgba(148,163,184,0.35);font-size:2.4vh;cursor:pointer;z-index:9998;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:opacity .2s;opacity:0.45;font-family:'Microsoft YaHei',sans-serif;font-weight:bold;"
        onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.45'">字</button>
<!-- 2026-06-02 字号面板拆成 1 全局 + 4 分类 (比赛名称/比赛项目/比赛时间/运动员信息); 全局 Ctrl +/-/0 仍生效, 4 分类乘在全局上 -->
<div id="fsSettingsPanel" class="hidden" style="position:fixed;right:1.2vw;bottom:14.4vh;width:44vh;background:#1e293b;color:#f8fafc;border-radius:10px;padding:2vh 2.2vh;box-shadow:0 8px 36px rgba(0,0,0,.55);z-index:9998;font-family:'Microsoft YaHei',sans-serif;font-size:1.7vh;border:1px solid #334155;max-height:88vh;overflow-y:auto;">

<script>
window.onbeforeunload = function(e) { e.preventDefault(); e.returnValue = ''; return '确定要关闭大屏幕显示？'; };

function goFullScreen() {
    var el = document.documentElement;
    if (document.fullscreenElement) return; // 已全屏
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.msRequestFullscreen) el.msRequestFullscreen();
}

var ws, data = {}, reconnectTimer;
var currentMode = 'SHOW_LIVE_RACE';
var publishedData = null;
var modeLocked = false;  // 成绩发布时锁定模式，不被广播覆盖
// 2026-06-04 备注栏 是否显示 出发反应时 (默认 true; 由 control / 主控 经 SET_DISPLAY_STYLE 推 false 关掉)
var _remarkShowReaction = true;
// 第1名分段成绩显示
var _dspFirstDetected = 0;
var _dspFirstTime = '';
var _dspFirstShowStart = 0;
var _dspFirstHoldSec = 3;
// 2026-06-04 1 名到达终点后, 右上角滚动时间 永久冻结 在 1 名 finalTime, 直到计时复位
//   (= 与之前的 _dspFirstShowStart + holdSec 短暂窗口期不同, 这是永久 latch)
var _dspFinalLatched = false;
var _dspFinalLatchedTime = '';
// 本地计时器（独立于服务器广播，保证滚动时间不间断）
var _dspTimerStart = 0;
var _dspTimerSynced = false;
// 2026-06-03 局部本地插值: 服务器 RUNNING_TIME_UPDATE 可能因网络 jitter / TCP 缓冲 突发到达 (2 帧夹一个 16ms),
//   单 setTimeout 看会"卡一下再跳" (0,2,3,4,6 跳跃感). 这里记最后一次服务器秒值 + 收到时刻,
//   100ms ticker 用 Date.now() 在两个服务器帧之间插值显示, 上限 1.5s 防漂移.
var _rtSrvSec = 0;
var _rtSrvAt = 0;
function _rtParse(s) {
    if (!s) return null;
    s = String(s).trim();
    var p = s.split(':'), n;
    if (p.length === 1) n = parseFloat(p[0]);
    else if (p.length === 2) n = parseFloat(p[0]) * 60 + parseFloat(p[1]);
    else if (p.length === 3) n = parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2]);
    else return null;
    return isNaN(n) ? null : n;
}
function _rtZ2(n) { return n < 10 ? '0' + n : '' + n; }
function _rtFmt(sec) {
    if (sec < 0) sec = 0;
    var tt = Math.floor(sec * 10);
    var t = tt % 10;
    var totalSecs = Math.floor(tt / 10);
    var s = totalSecs % 60, m = Math.floor(totalSecs / 60) % 60, h = Math.floor(totalSecs / 3600);
    if (h > 0) return h + ':' + _rtZ2(m) + ':' + _rtZ2(s) + '.' + t + ' ';
    if (m > 0) return m + ':' + _rtZ2(s) + '.' + t + ' ';
    return s + '.' + t + ' ';
}
function _rtAnchor(srvStr) {
    var parsed = _rtParse(srvStr);
    if (parsed == null) return;
    // 2026-06-03 防回跳: 服务器帧可能因 TCP 缓冲晚到 (= 此 parsed 值比当前 interp 小),
    //   旧逻辑会直接把锚点拉回 → display 出现 "0,1,2,1,2,3" 倒退. 这里检测到旧帧时
    //   保留当前 interp 值, 只刷新 _rtSrvAt, 让 display 继续往前推进; 真正的 race 复位
    //   走 waiting/ready 分支清 _rtSrvAt=0, 不会落到这条防回跳里.
    if (_rtSrvAt > 0) {
        var el = (Date.now() - _rtSrvAt) / 1000;
        if (el < 0) el = 0;
        if (el > 1.5) el = 1.5;
        var cur = _rtSrvSec + el;
        if (parsed < cur) { _rtSrvSec = cur; _rtSrvAt = Date.now(); return; }
    }
    _rtSrvSec = parsed;
    _rtSrvAt = Date.now();
}
function _rtInterp() {
    if (_rtSrvAt === 0) return null;
    var elapsed = (Date.now() - _rtSrvAt) / 1000;
    if (elapsed < 0) elapsed = 0;
    if (elapsed > 1.5) elapsed = 1.5;   // 上限 1.5s, 服务器卡住时不让显示无限往前跑
    return _rtFmt(_rtSrvSec + elapsed);
}
// 每道的显示状态跟踪：{lane: {splitCount, reactionShown, showTime}}
var laneDisplayState = {};
var refreshTimer = null;

var _connFailCount = 0;

// 启动总是先显示遮罩（即便 localStorage 有上次保存的IP，也以遮罩形式展示并让用户决定是否调整）
// 例外：URL 带 ?host=xxx 直连；或页面 hostname 不是 localhost 时直连
function getInitialHost() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('host')) return params.get('host');
    if (location.hostname && location.hostname !== '' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return location.hostname;
    return localStorage.getItem('swimServerHost') || '192.168.1.100';
}

function showConnectOverlay(statusText, statusColor) {
    var ov = document.getElementById('connectOverlay');
    if (ov) ov.style.display = 'flex';
    var st = document.getElementById('connStatus');
    if (st) {
        st.textContent = statusText || '请输入主服务器IP并点击连接';
        st.style.color = statusColor || '#f59e0b';
    }
}
function hideConnectOverlay() {
    var ov = document.getElementById('connectOverlay');
    if (ov) ov.style.display = 'none';
}

function overlayConnect() {
    var inp = document.getElementById('connHostInput');
    var ip = inp ? inp.value.trim() : '';
    if (!ip) { showConnectOverlay('请输入服务器IP', '#ef4444'); return; }
    localStorage.setItem('swimServerHost', ip);
    _connFailCount = 0;
    if (ws) try { ws.close(); } catch(e) {}
    showConnectOverlay('连接中… ' + ip + ':3002', '#f59e0b');
    connect();
}

function applyDisplayBg(value, persist) {
    if (typeof value !== 'string') return;
    var v = value.trim();
    if (!v) return;
    // 拒绝明显非法 (避免 XSS-style javascript: 等)
    if (/javascript:/i.test(v) || /expression\s*\(/i.test(v)) return;
    document.documentElement.style.setProperty('--bg', v);
    if (persist) {
        try { localStorage.setItem('swimDisplayBg', v); }
        catch(e) { alert('保存失败: 图片/数据太大无法存入 localStorage. 请用更小的图片.'); }
        // 2026-06-01 同步推送到服务器, 让其它 display.html / 控制端实时跟上
        _pushStyleToServer({ bg: v });
    }
    // 自定义输入框同步 (仅当是简单 hex 时)
    var isHex = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v);
    var picker = document.getElementById('bgCustomPicker');
    var hex = document.getElementById('bgCustomHex');
    if (isHex) {
        if (picker && v.length === 7) picker.value = v;
        if (hex) hex.value = v;
    }
    _refreshBgSwatchSelection(v);
}

function loadCustomBgImage(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { alert('请选择图片文件'); return; }
    if (file.size > 2 * 1024 * 1024) {
        if (!confirm('图片较大 (' + Math.round(file.size/1024) + 'KB), 可能因 localStorage 限制(~5MB)存不下. 继续?')) return;
    }
    var reader = new FileReader();
    reader.onload = function(e) {
        var dataUri = e.target.result;
        // 背景图覆盖全屏 + 兜底深邃蓝色 (图片透明区可见)
        var bgValue = "url('" + dataUri + "') center center / cover no-repeat fixed, #0f172a";
        applyDisplayBg(bgValue, true);
    };
    reader.onerror = function() { alert('读取图片失败'); };
    reader.readAsDataURL(file);
}

function _refreshBgSwatchSelection(active) {
    var ids = ['bgGridSolid','bgGridGradient','bgGridMesh','bgGridGray','bgGridPattern'];
    for (var g = 0; g < ids.length; g++) {
        var grid = document.getElementById(ids[g]);
        if (!grid) continue;
        var nodes = grid.children;
        for (var i = 0; i < nodes.length; i++) {
            var n = nodes[i];
            if (n.getAttribute('data-value') === active) n.classList.add('sel');
            else n.classList.remove('sel');
        }
    }
}

function _fillBgGrid(gridId, presets) {
    var grid = document.getElementById(gridId);
    if (!grid) return;
    grid.innerHTML = '';
    for (var i = 0; i < presets.length; i++) {
        var p = presets[i];
        var sw = document.createElement('div');
        sw.className = 'bg-swatch';
        sw.setAttribute('data-value', p.value);
        sw.title = p.name;
        sw.style.background = p.value;
        sw.textContent = p.name;
        (function(v){ sw.onclick = function(){ applyDisplayBg(v, true); }; })(p.value);
        grid.appendChild(sw);
    }
}

function _initBgSwatches() {
    _fillBgGrid('bgGridSolid', BG_PRESETS_SOLID);
    _fillBgGrid('bgGridGradient', BG_PRESETS_GRADIENT);
    _fillBgGrid('bgGridMesh', BG_PRESETS_MESH);
    _fillBgGrid('bgGridGray', BG_PRESETS_GRAY);
    _fillBgGrid('bgGridPattern', BG_PRESETS_PATTERN);
}

function toggleBgSettings() {
    var panel = document.getElementById('bgSettingsPanel');
    if (!panel) return;
    if (panel.classList.contains('hidden')) {
        _initBgSwatches();
        var current = localStorage.getItem('swimDisplayBg') || '#0f172a';
        _refreshBgSwatchSelection(current);
        if (/^#[0-9a-fA-F]{6}$/.test(current)) {
            var picker = document.getElementById('bgCustomPicker');
            var hex = document.getElementById('bgCustomHex');
            if (picker) picker.value = current;
            if (hex) hex.value = current;
        }
        panel.classList.remove('hidden');
    } else {
        panel.classList.add('hidden');
    }
}

// 2026-05-31 大屏字号缩放: 写入 --fs CSS 变量, 0.5x ~ 3.0x, 持久化 localStorage('swimDisplayFs').
var FS_MIN = 0.5, FS_MAX = 3.0, FS_STEP = 0.1;
function _clampFs(v) { v = Math.round(v * 10) / 10; return Math.max(FS_MIN, Math.min(FS_MAX, v)); }
function getFontScale() {
    try {
        var v = parseFloat(localStorage.getItem('swimDisplayFs') || '1');
        if (isNaN(v) || v <= 0) v = 1;
        return _clampFs(v);
    } catch(e) { return 1; }
}
function setFontScale(v) {
    v = _clampFs(v);
    try { localStorage.setItem('swimDisplayFs', String(v)); } catch(e) {}
    document.documentElement.style.setProperty('--fs', v);
    // 2026-06-01 推服务器, 让其它 display.html / 控制端实时跟上
    _pushStyleToServer({ fs: v });
    var lab = document.getElementById('fsScaleLabel');
    if (lab) lab.textContent = v.toFixed(1) + 'x';
}
function bumpFontScale(delta) { setFontScale(getFontScale() + delta); }

// 快捷键: Ctrl + / Ctrl - / Ctrl 0 (浏览器原生缩放被覆盖)
document.addEventListener('keydown', function(e) {
    if (!e.ctrlKey) return;
    if (e.key === '+' || e.key === '=' || e.code === 'NumpadAdd') {
        e.preventDefault(); bumpFontScale(FS_STEP);
    } else if (e.key === '-' || e.code === 'NumpadSubtract') {
        e.preventDefault(); bumpFontScale(-FS_STEP);
    } else if (e.key === '0' || e.code === 'Numpad0') {
        e.preventDefault(); setFontScale(1.0);
    }
});

// 兼容旧版：如果某些场景仍以 prompt() 方式询问 IP（如 URL 直连后又断开等），这里仍可调用
function getServerHost(forceAsk) {
    var params = new URLSearchParams(window.location.search);
    if (params.get('host')) return params.get('host');
    if (!forceAsk && location.hostname && location.hostname !== '' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return location.hostname;
    var saved = localStorage.getItem('swimServerHost');
    if (!forceAsk && saved) return saved;
    var def = saved || '192.168.1.100';
    var ip = prompt('请输入服务器IP地址:', def);
    if (ip) { localStorage.setItem('swimServerHost', ip); return ip; }
    return saved || 'localhost';
}

function changeServerHost() {
    // 优先使用遮罩内输入；若被外部代码调用，也保留 prompt 兜底询问一次
    showConnectOverlay('请重新输入服务器IP并点击连接', '#f59e0b');
    _connFailCount = 0;
    var inp = document.getElementById('connHostInput');
    if (!inp || !document.getElementById('connectOverlay')) {
        var h = getServerHost(true);
        if (ws) try { ws.close(); } catch(e) {}
        connect();
    }
}

function connect() {
    var host = getServerHost();
    document.title = '大屏幕 - ' + host;
    try { ws = new WebSocket('ws://' + host + ':3002'); }
    catch (ex) {
        // 2026-06-04 new WebSocket 构造异常 (= host 格式错 / 浏览器限制) 也要 2s 后重试, 不能卡死
        // 2026-06-06 静默重连: 已连过则保留画面, 仅首次失败显 overlay
        if (!data || Object.keys(data).length === 0) {
            showConnectOverlay('请输入服务器IP并点击连接', '#f59e0b');
        }
        setTimeout(connect, 2000);
        return;
    }
    ws.onopen = function() {
        _connFailCount = 0;
        ws.send(JSON.stringify({type: 'DISPLAY_IDENTITY'}));
        hideConnectOverlay();   // 只有连接成功才隐藏遮罩
    };
    // 用 requestAnimationFrame 合并消息：服务器密集广播时（每个触板/盲表都广播一次），
    // 手机若每条都解析+渲染一次会严重积压（手机 JS 引擎慢，几十 KB JSON.parse 5–20ms）。
    // 这里只保留"最新一份 SHOW_LIVE_RACE 数据"，下一帧统一渲染——10 条消息瞬间到达，
    // 也只渲染 1 次最新状态，队列瞬间排空，"计时复位"等关键事件能立刻反映到大屏。
    var _pendingMode = null;
    var _pendingData = null;
    var _renderScheduled = false;
    // 2026-05-25 操作员主动锁定的"非比赛"显示模式 — 收到不带 modeExplicit 的 SHOW_LIVE_RACE
    // 心跳时不会切回 LIVE_RACE，避免总排名/团体/纪录/颁奖等翻页中途被服务器心跳打断
    var LOCKABLE_MODES = {
        'SHOW_EVENT_RANKING': 1, 'SHOW_TEAM_STANDINGS': 1, 'SHOW_RECORDS': 1,
        'SHOW_REFEREES': 1,
        'SHOW_AWARDS': 1, 'SHOW_WELCOME': 1, 'SHOW_PAUSE': 1,
        'SHOW_START_LIST': 1, 'SHOW_HEAT_RESULT': 1,
        'SHOW_EVENT_LIST': 1, 'SHOW_PROMOTION_LIST': 1
    };
    function _scheduleRender(mode, payload, modeExplicit) {
        _pendingMode = mode;
        _pendingData = payload || {};
        if (_renderScheduled) return;
        _renderScheduled = true;
        var doIt = function() {
            _renderScheduled = false;
            if (_pendingMode) {
                // 操作员显式切到非比赛模式 → 锁定，让后续 LIVE_RACE 心跳无法夺权
                if (modeExplicit && LOCKABLE_MODES[_pendingMode]) modeLocked = true;
                // 操作员显式切回 LIVE_RACE → 解锁
                else if (modeExplicit && _pendingMode === 'SHOW_LIVE_RACE') modeLocked = false;
                // 心跳类（非 explicit）默认不改 modeLocked
                else if (!modeExplicit) { /* keep current modeLocked */ }
                currentMode = _pendingMode;
                data = _pendingData;
                _pendingMode = null;
                _pendingData = null;
                try { render(); } catch (e) {}
                startRefreshTimer();
            }
        };
        if (window.requestAnimationFrame) requestAnimationFrame(doIt);
        else setTimeout(doIt, 16);
    }

    ws.onmessage = function(e) {
        var msg;
        try { msg = JSON.parse(e.data); } catch (er) { return; }
        // 硬件 0.1s 节拍的轻量滚动时间帧 — 只更新右上角时间，不重渲染整页
        if (msg.type === 'RUNNING_TIME_UPDATE') {
            if (msg.data && typeof msg.data.runningTime === 'string') {
                data.runningTime = msg.data.runningTime;
                if (typeof msg.data.clockPaused === 'boolean') data.clockPaused = msg.data.clockPaused;
                // 2026-06-03 给本地插值器一个新锚点 (= 服务器秒值 + Date.now()), 让 100ms ticker 在两帧之间平滑推进, 消除 jitter 跳跃感
                if (!data.clockPaused) _rtAnchor(msg.data.runningTime);
                try { _updateRunningTimeOnly(); } catch (er2) {}
            }
            return;
        }
        if (msg.type === 'SHOW_PUBLISHED_RESULT') {
            currentMode = 'SHOW_PUBLISHED_RESULT';
            publishedData = msg.data;
            modeLocked = true;
            renderPublishedResult(msg.data);
            return;
        }
        if (msg.type === 'SHOW_MEDIA') {
            currentMode = 'SHOW_MEDIA';
            modeLocked = true;
            renderMedia(msg.data || {});
            return;
        }
        // 2026-06-01 大屏样式远程推送: 服务器广播最新 bg / fs / textStyle, 立即应用 (不持久化到本地 localStorage,
        //   服务器是唯一权威源; 本地 localStorage 只在没收到服务器推送时作为初始默认)
        if (msg.type === 'DISPLAY_STYLE_PUSH') {
            try { applyRemoteDisplayStyle(msg.data || {}); } catch (er3) {}
            return;
        }
        // 2026-05-25 修复 #N：非显式 SHOW_LIVE_RACE 心跳 + 已锁定 → 只更新 data 不切视图
        // (修复总排名翻到第 3 页时被服务器心跳广播打回比赛视图的 bug)
        if (msg.type === 'SHOW_LIVE_RACE' && modeLocked && !msg.modeExplicit) {
            data = msg.data || {};
            return;
        }
        // 2026-06-01 修复: 服务器发给 EXE/HTML race_control 的通知类消息 (STAGE_COMPLETE /
        //   PROMOTION_DONE / REGISTER_* 等) 不应进入 _scheduleRender — 否则会被当成视图模式
        //   设到 currentMode, 走默认 renderRace() + data={} 路径, 大屏闪一下空比赛视图.
        //   只放行 SHOW_* 视图切换消息; RUNNING_TIME_UPDATE 已在上面处理.
        if (typeof msg.type !== 'string' || msg.type.indexOf('SHOW_') !== 0) return;
        // 其它消息走帧合并；modeExplicit 由 _scheduleRender 决定是否锁/解锁
        _scheduleRender(msg.type, msg.data, !!msg.modeExplicit);
    };
    ws.onclose = function() {
        stopRefreshTimer();
        _connFailCount++;
        // 2026-06-04 改: 不再每 3 次失败 confirm() 卡住, 大屏需要 24×7 无人值守 自动重连.
        //   断开后 2s 自动按 上次 IP (localStorage.swimServerHost 或 URL ?host=) 重连, 直到连上.
        // 2026-06-06 改: 曾连成功过 (data 非空) 时, 保留断开前画面, 不弹 overlay, 后台静默重连;
        //   仅首次连接失败 (data 还空) 才显 overlay 让操作员输入 IP.
        if (data && Object.keys(data).length > 0) {
            // 静默重连 — 大屏继续显示最后一帧, 隐藏所有连接提示
            hideConnectOverlay();
        } else {
            var host = getServerHost();
            showConnectOverlay('请输入服务器IP并点击连接', '#f59e0b');
        }
        setTimeout(connect, 2000);
    };
    ws.onerror = function() {
        // 2026-06-06 静默重连, 不弹 overlay (除非首次连接)
        if (!data || Object.keys(data).length === 0) {
            var host = getServerHost();
            showConnectOverlay('请输入服务器IP并点击连接', '#f59e0b');
        }
    };
}

// 高频但廉价的滚动时间 ticker（每 100ms 一次，只更新右上角 #runningTime 元素）
// 替代之前 500ms 全屏 render 导致的卡顿：
//   1) 滚动时间走时由本地计时器插值，不依赖网络刷新
//   2) 其它内容（运动员/分段/名次/备注）只在收到新广播时更新且只改有变化的字段
var _runningTimeTicker = null;
function startRunningTimeTicker() {
    if (_runningTimeTicker) return;
    _runningTimeTicker = setInterval(function() {
        if (currentMode !== 'SHOW_LIVE_RACE') return;
        var st = (data.raceState||'').toLowerCase();
        if (st !== 'racing' && st !== 'finished') return;
        try { _updateRunningTimeOnly(); } catch (e) {}
    }, 100);
}
function stopRunningTimeTicker() {
    if (_runningTimeTicker) { clearInterval(_runningTimeTicker); _runningTimeTicker = null; }
}

// 较低频的"显示窗口超时"刷新（每 250ms 走一次廉价的 _refreshRaceRows
// 让到时间的分段成绩自动消隐；不会重建 DOM，开销极小）
function startRefreshTimer() {
    if (refreshTimer) return;
    refreshTimer = setInterval(function() {
        if (currentMode !== 'SHOW_LIVE_RACE') return;
        var st = (data.raceState||'').toLowerCase();
        if (st !== 'racing' && st !== 'finished') return;
        try { _refreshRaceRows(); } catch (e) {}
    }, 250);
    startRunningTimeTicker();
}

function stopRefreshTimer() {
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    stopRunningTimeTicker();
}

function render() {
    document.getElementById('compName').textContent = data.competitionName || '游泳赛事管理系统';

    // 隐藏所有视图，清除翻页定时器
    if (_rankingPageTimer) { clearInterval(_rankingPageTimer); _rankingPageTimer = null; }
    // 2026-06-01 本组成绩定时器也要清, 避免上一组的 timer 在新视图里继续 setInterval 触发 showHeatResultPage
    if (_heatResultPageTimer) { clearInterval(_heatResultPageTimer); _heatResultPageTimer = null; }
    document.getElementById('raceView').classList.add('hidden');
    document.getElementById('listView').classList.add('hidden');
    document.getElementById('welcomeView').classList.add('hidden');
    document.getElementById('awardView').classList.add('hidden');
    hideMediaView();

    // 成绩确认后自动切换到本组成绩排名
    if (data.resultConfirmed && currentMode === 'SHOW_LIVE_RACE') {
        renderHeatResult();
        return;
    }

    switch(currentMode) {
        case 'SHOW_LIVE_RACE': renderRace(); break;
        case 'SHOW_START_LIST': renderStartList(); break;
        case 'SHOW_HEAT_RESULT': renderHeatResult(); break;
        case 'SHOW_PUBLISHED_RESULT': if (publishedData) renderPublishedResult(publishedData); break;
        case 'SHOW_EVENT_RANKING': renderEventRanking(); break;
        case 'SHOW_TEAM_STANDINGS': renderTeamStandings(); break;
        case 'SHOW_AWARDS': renderAwards(); break;
        case 'SHOW_RECORDS': renderRecords(); break;
        case 'SHOW_REFEREES': renderReferees(); break;
        case 'SHOW_WELCOME': case 'SHOW_PAUSE':
            renderWelcome(); break;
        default: renderRace();
    }
}

// 媒体（图片/视频）显示控制
function hideMediaView() {
    var mv = document.getElementById('mediaView');
    if (!mv) return;
    mv.classList.add('hidden');
    mv.style.display = 'none';
    var v = document.getElementById('mediaVideo');
    if (v) { try { v.pause(); } catch(e) {} v.removeAttribute('src'); v.load && v.load(); v.style.display = 'none'; }
    var img = document.getElementById('mediaImg');
    if (img) { img.removeAttribute('src'); img.style.display = 'none'; }
}
function renderMedia(d) {
    // 隐藏其他视图，确保媒体在最前
    if (_rankingPageTimer) { clearInterval(_rankingPageTimer); _rankingPageTimer = null; }
    document.getElementById('raceView').classList.add('hidden');
    document.getElementById('listView').classList.add('hidden');
    document.getElementById('welcomeView').classList.add('hidden');
    document.getElementById('awardView').classList.add('hidden');
    var mv = document.getElementById('mediaView');
    var img = document.getElementById('mediaImg');
    var vid = document.getElementById('mediaVideo');
    if (!mv || !img || !vid) return;
    mv.classList.remove('hidden');
    mv.style.display = 'flex';
    var fit = d.fit || 'contain';
    var fitCss = (fit === 'cover') ? 'cover' : (fit === 'fill' ? 'fill' : 'contain');
    if (d.kind === 'image') {
        try { vid.pause(); } catch(e) {}
        vid.removeAttribute('src'); vid.load && vid.load(); vid.style.display = 'none';
        img.style.display = '';
        img.style.objectFit = fitCss;
        img.style.width = '100vw';
        img.style.height = '100vh';
        img.src = d.dataUrl || '';
    } else if (d.kind === 'video') {
        img.removeAttribute('src'); img.style.display = 'none';
        vid.style.display = '';
        vid.style.objectFit = fitCss;
        vid.style.width = '100vw';
        vid.style.height = '100vh';
        vid.loop = !!d.loop;
        vid.muted = !!d.muted;
        vid.controls = false;
        vid.src = d.dataUrl || '';
        if (d.autoplay !== false) {
            try { vid.play(); } catch(e) {}
        }
    }
}

function isRelayEvent() { return (data.currentEvent||'').indexOf('接力') >= 0; }

// 2026-06-01 性别显示规范: 男 → "男子", 女 → "女子", 混合 → "混合" (不加子),
//   修复混合性别接力赛标题里显示"混合子"的 bug. 数据层保留 "男"/"女"/"混合" 不变.
function fmtGender(g) {
    g = g || '';
    if (g === '男' || g === '女') return g + '子';
    return g;   // 混合 / 已经是 男子/女子 / 空串 都原样返回
}

// 2026-06-01 大屏样式远程推送应用: 服务器广播 DISPLAY_STYLE_PUSH → 本地立即应用 bg/fs/textStyle.
//   服务器是权威源; 本地 localStorage 只作为初始默认 (无服务器/未连接时).
//   _suppressStylePush 在收到推送应用过程中临时为 true, 防止 setFontScale/applyDisplayBg/setTextColor
//   等本地 setter 又把同一个值再推送回服务器形成回环.
var _suppressStylePush = false;
function applyRemoteDisplayStyle(d) {
    if (!d) return;
    _suppressStylePush = true;
    try {
        if (typeof d.bg === 'string' && d.bg) {
            try { applyDisplayBg(d.bg, true); } catch(e) {}
        }
        if (typeof d.fs === 'number' && d.fs > 0) {
            try { setFontScale(d.fs); } catch(e) {}
        }
        // 2026-06-02 4 类分类字号同步
        if (d.fsParts && typeof d.fsParts === 'object') {
            for (var fk in d.fsParts) {
                if (!d.fsParts.hasOwnProperty(fk)) continue;
                var fv = parseFloat(d.fsParts[fk]);
                if (!isNaN(fv) && fv > 0) { try { setFsPart(fk, fv, true); } catch(e) {} }
            }
        }
        // 2026-06-03 大屏右上角 WR/CR 横条 显示/隐藏 同步
        if (typeof d.recordsHidden === 'boolean') {
            var hr = document.querySelector('.header-records');
            if (hr) hr.style.display = d.recordsHidden ? 'none' : '';
        }
        // 2026-06-04 备注栏 是否显示 出发反应时 同步 (默认 true)
        if (typeof d.remarkShowReaction === 'boolean') {
            _remarkShowReaction = d.remarkShowReaction;
        }
        if (d.textStyle && typeof d.textStyle === 'object') {
            for (var k in d.textStyle) {
                if (!d.textStyle.hasOwnProperty(k)) continue;
                var v = d.textStyle[k] || {};
                if (v.c) { try { setTextColor(k, v.c, true); } catch(e) {} }
                if (v.f) { try { setTextFont(k, v.f, true); } catch(e) {} }
            }
        }
    } finally {
        _suppressStylePush = false;
    }
}

// 把本地修改通过 WebSocket 推给服务器 → 服务器合并后再广播给其它客户端
function _pushStyleToServer(payload) {
    if (_suppressStylePush) return;
    if (!ws || ws.readyState !== 1) return;
    try { ws.send(JSON.stringify({ type: 'SET_DISPLAY_STYLE', data: payload })); } catch(e) {}
}

function getLaneCount() {
    return (data.poolConfig && data.poolConfig.lanes) ? data.poolConfig.lanes : 10;
}

// ─── 比赛视图分区刷新机制 ─────────────────────────────────────
// 把"比赛实时画面"分成 4 类，按各自变化频率独立更新：
//   1) 顶部静态：赛事名 / 项目 / 阶段·组 / 纪录条 — 数据变化时才更新文字
//   2) 滚动时间右上角 — 100ms 本地插值，独立 ticker（_runningTimeTicker）
//   3) 泳道行 DOM —— 仅在 buildKey 变（项目/组/泳道布局）时重建一次；
//      运动员数据更新时按字段对比、最小化 textContent / className 写入
//   4) 显示窗口超时消隐 —— 250ms 廉价刷新（只走 _refreshRaceRows，无 DOM 重建）
var _raceRowsBuiltKey = '';
var _raceRowDOM = [];   // [{lane, row, laneNum, nameEl, teamEl, resultEl, rankEl, remarkEl, lastClass, lastResult, lastResultColor, lastRank, lastRankClass, lastRemark, lastRemarkColor, lastNameHtml, lastTeamHtml, lastLaneNum}]
var _raceHeaderRelay = null;

function renderRace() {
    document.getElementById('raceView').classList.remove('hidden');

    // ── 1) 顶部静态文字（仅变化才写入） ──
    // 2026-06-04 标题最前加 项次 '第N项 ' (= 服务器 currentEventNumber, 0 时为空)
    // 2026-06-04 顺序统一改为 性别 组别 项目 (= 性别 在前)
    var evNo = data.currentEventNumber || 0;
    var titleText = (evNo > 0 ? ('第' + evNo + '项 ') : '')
        + fmtGender(data.currentGender) + ' '
        + ((data.currentAgeGroup||'') ? (data.currentAgeGroup+' ') : '')
        + (data.currentEvent||'');
    var stageText = (data.currentStage||'') + ' 第' + (data.currentHeat||0) + '/' + (data.totalHeats||0) + '组';
    var en = document.getElementById('eventName');
    if (en && en.textContent !== titleText) en.textContent = titleText;
    // 2026-06-05 项目名称下 一行 显示 本项目所有组别 纪录 (= server applicableRecords)
    _renderApplicableRecords(data.applicableRecords);
    var sh = document.getElementById('stageHeat');
    if (sh && sh.textContent !== stageText) sh.textContent = stageText;

    // ── 显示窗口参数复位 ──
    // 2026-05-27 移除本地计时器同步逻辑: 硬件 0x7F 是唯一时间源, 服务器 100ms 节拍广播,
    //   直接显示 data.runningTime, 不再 Date.now() 本地插值. _dspTimerStart 字段保留不再使用.
    var rState = (data.raceState||'').toLowerCase();
    if (rState === 'waiting' || rState === 'ready') {
        _dspFirstDetected = 0; _dspFirstShowStart = 0; _dspFirstTime = '';
    }
    // 2026-05-26 滚动时间区"1 名成绩停留时长"改用 firstPlaceHoldTime (= 参数:第1名成绩显示时间), 与主控 RaceTimer_Tick 同一参数, 不再用 splitDisplayTime (那是每泳道分段成绩显示时长, 性质不同)
    _dspFirstHoldSec = (data.laneCloseSettings && data.laneCloseSettings.firstPlaceHoldTime) ? data.laneCloseSettings.firstPlaceHoldTime : 3;

    // ── 计算 leader 与第1名成绩（仅在真实分段计数变化时更新）──
    var dspSwimmers = data.swimmers || [];
    var dspLeader = null, dspLeaderSc = 0, dspLeaderLast = '';
    for (var di = 0; di < dspSwimmers.length; di++) {
        var ds = dspSwimmers[di];
        if (ds.status) continue;
        var rsi = _realSplitInfoOf(ds);
        var dsc = rsi.count;
        if (ds.isFinished && ds.finalTime) dsc = 9999;
        if (dsc > dspLeaderSc || (dsc === dspLeaderSc && dspLeader && ds.rank > 0 && ds.rank < (dspLeader.rank||99))) {
            dspLeaderSc = dsc;
            dspLeader = ds;
            dspLeaderLast = ds.isFinished && ds.finalTime ? ds.finalTime : rsi.last;
        }
    }
    if (dspLeader) {
        var dlsc = dspLeaderSc;
        if (dlsc !== _dspFirstDetected) {
            _dspFirstDetected = dlsc;
            if (dspLeader.isFinished && dspLeader.finalTime) {
                _dspFirstTime = dspLeader.finalTime;
            } else if (dspLeaderLast) {
                _dspFirstTime = dspLeaderLast;
            }
            if (_dspFirstTime) _dspFirstShowStart = Date.now();
        }
        // 2026-06-04 1 名实际到达终点 (isFinished=true) → 永久锁定 finalTime 到右上角
        //   首次锁定后不再更新, 即使后续 2/3 名也完赛; 直到 计时复位 (waiting/ready) 清掉
        if (!_dspFinalLatched && dspLeader.isFinished && dspLeader.finalTime) {
            _dspFinalLatched = true;
            _dspFinalLatchedTime = dspLeader.finalTime;
        }
    }

    // ── 滚动时间（首次/状态切换写一次；100ms ticker 持续更新） ──
    _updateRunningTimeOnly();

    // ── 纪录条（变化才写） ──
    var mainLabel = data.displayRecordLabel || 'WR';
    var mainTypeName = data.displayRecordTypeName || '世界纪录';
    var wrText = '-', crText = '-';
    var records = data.records || [];
    var curGender = data.currentGender || '';
    var curEventName = data.currentEvent || '';
    for (var r = 0; r < records.length; r++) {
        var rec = records[r];
        if (rec.gender === curGender && rec.eventName === curEventName) {
            var rt = rec.recordType || '';
            if (rt === mainTypeName || rt.indexOf(mainTypeName) >= 0) wrText = rec.time || '-';
            else if (rt === '赛会纪录') crText = rec.time || '-';
        }
    }
    var labelEl = document.getElementById('recordMainLabel');
    if (labelEl && labelEl.textContent !== mainLabel) labelEl.textContent = mainLabel;
    var wrEl = document.getElementById('recordWR'); if (wrEl && wrEl.textContent !== wrText) wrEl.textContent = wrText;
    var crEl = document.getElementById('recordCR'); if (crEl && crEl.textContent !== crText) crEl.textContent = crText;

    // ── 等待状态：清空显示状态 ──
    if (rState === 'waiting') {
        laneDisplayState = {};
    }

    // ── 3) 泳道行 DOM 缓存 / 重建 ──
    _ensureRaceRowsDom();
    // ── 4) 字段刷新（仅按需更新文字/类名，不重建 DOM）──
    _refreshRaceRows();
}

// 抽出来给 100ms ticker 复用：仅写右上角 #runningTime 文本/颜色
function _updateRunningTimeOnly() {
    var runEl = document.getElementById('runningTime');
    if (!runEl) return;
    // 计时控制端确认本组成绩后，大屏切换到本组成绩榜，滚动时间不再显示
    // （否则 100ms ticker 会把 renderHeatResult 设的空文本反复覆盖回去）
    // 2026-06-01 修复: 非"比赛主视图"也不更新. 计时复位后 _resultConfirmed=false 但大屏
    //   仍锁在 SHOW_HEAT_RESULT (modeLocked), 此函数还会被 RUNNING_TIME_UPDATE 调用.
    //   若不拦, 硬件残留的旧 0x7F 值会通过此处写回 runEl, 大屏右上角错显上组时间.
    if ((data && data.resultConfirmed) || currentMode !== 'SHOW_LIVE_RACE') {
        if (runEl.textContent !== '') runEl.textContent = '';
        if (runEl.style.color !== '') runEl.style.color = '';
        return;
    }
    // 2026-06-02 等待/就绪状态强制显 "0.00":
    //   场景: 确认成绩 → 计时复位 → 主控切到其它 Tab → 切回比赛控制 Tab (触发 Broadcast()
    //   把当前 _runningTime 推给所有客户端) → 用户点 "比赛视图" → 大屏右上角错显上组成绩.
    //   根因: 硬件 0x7F 残留帧把 _runningTime 推到了非 0; RemoteTimingControl /
    //   race_control.html 已有同款 idle/done guard, 这里补齐 display.html.
    var rState = (data && data.raceState ? data.raceState : '').toLowerCase();
    if (rState === 'waiting' || rState === 'ready') {
        if (runEl.textContent !== '0.00') runEl.textContent = '0.00';
        if (runEl.style.color !== '') runEl.style.color = '';
        // 2026-06-03 复位后清掉本地插值锚点, 下一组 racing 前等服务器送第一个新锚点, 不沿用上组残留
        _rtSrvAt = 0; _rtSrvSec = 0;
        // 2026-06-04 计时复位 → 解锁 1 名 finalTime 锁定, 下一组重头开始
        _dspFinalLatched = false; _dspFinalLatchedTime = '';
        return;
    }
    // 2026-06-04 1 名已到终点 → 永久冻结显示 finalTime, 优先级高于 interp 和 leader 短暂窗口
    if (_dspFinalLatched && _dspFinalLatchedTime) {
        if (runEl.textContent !== _dspFinalLatchedTime) runEl.textContent = _dspFinalLatchedTime;
        if (runEl.style.color !== '#22c55e') runEl.style.color = '#22c55e';
        return;
    }
    // 2026-06-03 重新打开本地插值 (有界 1.5s 上限). 之前去掉本地插值因为 ±100ms 漂移, 但服务器
    //   WS 帧因网络/TCP buffering 会突发到达 (一拨 2-3 帧夹在 16ms 内), 用户看就是 "0,2,3,4,6" 跳跃感.
    //   现在拿 _rtSrvSec + (Date.now() - _rtSrvAt) 做平滑推进; 服务器卡住 > 1.5s 就停在那里
    //   (= 硬件不再发 0x7F, 显示也不该自己飞).
    var localRunTime;
    if (data.clockPaused) {
        localRunTime = data.runningTime || '0.0';   // 停表: 直接用服务器快照值
    } else {
        var interp = _rtInterp();
        localRunTime = interp != null ? interp : (data.runningTime || '0.0');
    }
    var dspHoldMs = _dspFirstHoldSec * 1000;
    var showLeader = (_dspFirstShowStart > 0 && (Date.now() - _dspFirstShowStart) < dspHoldMs && _dspFirstTime);
    var newText = showLeader ? _dspFirstTime : localRunTime;
    var newColor = showLeader ? '#22c55e' : '';
    if (runEl.textContent !== newText) runEl.textContent = newText;
    if (runEl.style.color !== newColor) runEl.style.color = newColor;
}

// 计算单运动员"已有真实时间"的分段计数 + 最新累计
function _realSplitInfoOf(ds) {
    var c = 0, last = '';
    if (ds && ds.splits) {
        for (var i = 0; i < ds.splits.length; i++) {
            var sp = ds.splits[i];
            var cum = sp && (sp.cumulative || sp.time) ? (sp.cumulative || sp.time) : '';
            if (cum) { c++; last = cum; }
        }
    }
    return { count: c, last: last };
}

// 接力项目：根据当前圈数推算正在游的棒次，返回 "第N棒: 队员姓名"
// 与 race_control.html / 主控 ComputeRelayCurrentLegLabel 同算法
function getRelayCurrentLegName(sw) {
    var names = (sw.name||'').split(',');
    if (names.length <= 1) return (sw.name || '').trim();
    // 优先用服务器的 displayedCurrentLap（含 spinner 加圈/减圈偏移），
    // 旧版主控只有 currentLap 时退回用之
    var currentLap = (typeof sw.displayedCurrentLap === 'number') ? sw.displayedCurrentLap : (sw.currentLap || 0);
    var ev = data.currentEvent || '';
    var m = ev.match(/(\d+)\s*[x×]\s*(\d+)/);
    var legCount = m ? parseInt(m[1]) : 4;
    var legDist = m ? parseInt(m[2]) : 100;
    var poolLen = (data.poolConfig && data.poolConfig.length) ? data.poolConfig.length : 50;
    var lapsPerLeg = Math.max(1, Math.floor(legDist / poolLen));
    var currentLeg = Math.floor(currentLap / lapsPerLeg);  // 0-based
    if (currentLeg >= legCount) currentLeg = legCount - 1;
    if (currentLeg < 0) currentLeg = 0;
    if (sw.isFinished) currentLeg = legCount - 1;
    var legName = (currentLeg < names.length) ? names[currentLeg].trim() : names[0].trim();
    return '第' + (currentLeg + 1) + '棒: ' + legName;
}

// 2026-05-31 比赛视图接力行: 同列显示 4 棒+姓名, 当前棒高亮金色.
function getRelayAllLegNames(sw) {
    var names = (sw.name||'').split(',');
    if (names.length <= 1) return (sw.name || '').trim();
    var currentLap = (typeof sw.displayedCurrentLap === 'number') ? sw.displayedCurrentLap : (sw.currentLap || 0);
    var ev = data.currentEvent || '';
    var m = ev.match(/(\d+)\s*[x×]\s*(\d+)/);
    var legCount = m ? parseInt(m[1]) : 4;
    var legDist = m ? parseInt(m[2]) : 100;
    var poolLen = (data.poolConfig && data.poolConfig.length) ? data.poolConfig.length : 50;
    var lapsPerLeg = Math.max(1, Math.floor(legDist / poolLen));
    var currentLeg = Math.floor(currentLap / lapsPerLeg);
    if (currentLeg >= legCount) currentLeg = legCount - 1;
    if (currentLeg < 0) currentLeg = 0;
    // 2026-06-04 去掉 "N棒:" 前缀, 改逗号分隔; 当前游的棒次仍金色高亮 (无前缀, 仅靠颜色区分)
    var html = '';
    for (var i = 0; i < legCount; i++) {
        var nm = (i < names.length) ? names[i].trim() : '';
        var isCur = (i === currentLeg && !sw.isFinished);
        if (i > 0) html += '<span style="color:#cbd5e1;">, </span>';
        if (isCur) html += '<span style="color:#f59e0b;font-weight:bold;">' + nm + '</span>';
        else html += '<span style="color:#cbd5e1;">' + nm + '</span>';
    }
    return html;
}

// 2026-05-27 改: 按场地配置的泳道数显示全部泳道, 没有运动员的也显示空白行
// 后端会为每条池中道下发占位 (status='EMPTY' 或 name+bib 都空), 这里全部保留, 在
// _refreshRaceRows 里通过 status==='EMPTY' 判定渲染成空行。
function _activeSwimmersForDisplay() {
    var arr = data.swimmers || [];
    var poolLanes = (data.poolConfig && Array.isArray(data.poolConfig.laneNumbers))
        ? data.poolConfig.laneNumbers : null;
    var out = [];
    var seenLanes = {};
    for (var i = 0; i < arr.length; i++) {
        var s = arr[i];
        if (!s || s.lane == null) continue;
        // 只保留池中道的占位; 池外的脏数据剔除
        if (poolLanes && poolLanes.indexOf(s.lane) < 0) continue;
        out.push(s);
        seenLanes[s.lane] = true;
    }
    // 兜底: 池中道但后端漏发占位 → 这里补一条 EMPTY 占位, 保证渲染时空道数齐
    if (poolLanes) {
        for (var pi = 0; pi < poolLanes.length; pi++) {
            var ln = poolLanes[pi];
            if (!seenLanes[ln]) {
                out.push({ lane: ln, name: '', country: '', countryShort: '', status: 'EMPTY', splits: [], finalTime: '', rank: 0 });
            }
        }
    }
    // 按"参数设置 → 道次顺序"排序: 正序 0→9 (顶到底); 逆序 9→0
    var lo = (data.laneCloseSettings && data.laneCloseSettings.laneOrder === 'reverse') ? 'reverse' : 'forward';
    out.sort(function(a, b) {
        var d = (a.lane || 0) - (b.lane || 0);
        return lo === 'reverse' ? -d : d;
    });
    return out;
}

// DOM 构建：仅在 buildKey 变化时执行（运动员名单/泳道布局/接力切换/泳道数）
function _ensureRaceRowsDom() {
    var lc = getLaneCount();
    // 2026-06-03 内联 style 会覆盖 .lanes-header CSS, 必须自带 fs 缩放变量
    // 2026-06-04 表头改用 --fs-header (与 td 的 --fs-info 解耦), 让 第3行 单独调
    var fs = lc <= 8 ? 'calc(3.5vh * var(--fs) * var(--fs-header))' : 'calc(2.9vh * var(--fs) * var(--fs-header))';
    var relay = isRelayEvent();
    var swimmers = _activeSwimmersForDisplay();
    var keyParts = [data.currentEvent||'', data.currentHeat||0, lc, relay?1:0, swimmers.length];
    for (var k = 0; k < swimmers.length; k++) {
        keyParts.push((swimmers[k].lane != null ? swimmers[k].lane : -1) + ':' + (swimmers[k].name||''));
    }
    var key = keyParts.join('|');
    if (key === _raceRowsBuiltKey) return;

    // 2026-05-26 修复 display 端不显示每泳道分段成绩:
    //   laneDisplayState 之前只在 rState==='waiting' 时清空。但比赛切组常走
    //   Finished → Ready → Racing 而不经过 Waiting, 上一组遗留的 splitCount
    //   (例如 200m=4 段) 会卡住新组判断: realSplitCount(1) > ls.splitCount(4) 为假
    //   → showTime 不更新 → 分段成绩永远不进入 5s 显示窗口。
    //   DOM key 变 (heat/event/swimmer 任一变化) 即整体清空, 与 PC 端
    //   Restart_Click 清 _laneSplitCount 对称。
    laneDisplayState = {};

    // 表头
    // 2026-06-04 加 "组别" 列 (区分并组中 不同 AgeCategory); 7 列重新调比例 (与下方 .lane-row 同步)
    //   个人: 道次4 / 名次4 / 姓名11 / 代表队9 / 组别8 / 成绩13 / 备注7
    //   接力: 道次4 / 名次4 / 代表队6 / 姓名(4棒)28 / 组别8 / 成绩13 / 备注7
    var header = document.querySelector('.lanes-header');
    if (header) {
        if (relay) {
            header.innerHTML =
                '<div style="flex:4;min-width:0;text-align:center;margin-right:1vw;font-size:'+fs+';">道次</div>' +
                '<div style="flex:4;min-width:0;text-align:center;margin-right:1vw;font-size:'+fs+';">名次</div>' +
                '<div style="flex:6;min-width:0;text-align:center;margin-right:1vw;font-size:'+fs+';">代表队</div>' +
                '<div style="flex:28;min-width:0;text-align:center;margin-right:1vw;font-size:'+fs+';">姓名</div>' +
                '<div style="flex:8;min-width:0;text-align:center;margin-right:1vw;font-size:'+fs+';">组别</div>' +
                '<div style="flex:13;min-width:0;text-align:center;margin-right:1vw;font-size:'+fs+';">成绩</div>' +
                '<div style="flex:7;min-width:0;text-align:center;font-size:'+fs+';">备注</div>';
        } else {
            header.innerHTML =
                '<div style="flex:4;min-width:0;text-align:center;margin-right:1vw;font-size:'+fs+';">道次</div>' +
                '<div style="flex:4;min-width:0;text-align:center;margin-right:1vw;font-size:'+fs+';">名次</div>' +
                '<div style="flex:11;min-width:0;text-align:center;margin-right:1vw;font-size:'+fs+';">姓名</div>' +
                '<div style="flex:9;min-width:0;text-align:center;margin-right:1vw;font-size:'+fs+';">代表队</div>' +
                '<div style="flex:8;min-width:0;text-align:center;margin-right:1vw;font-size:'+fs+';">组别</div>' +
                '<div style="flex:13;min-width:0;text-align:center;margin-right:1vw;font-size:'+fs+';">成绩</div>' +
                '<div style="flex:7;min-width:0;text-align:center;font-size:'+fs+';">备注</div>';
        }
    }

    var container = document.getElementById('lanesContainer');
    if (!container) return;
    container.innerHTML = '';
    _raceRowDOM = [];
    _raceHeaderRelay = relay;

    for (var i = 0; i < swimmers.length; i++) {
        var sw = swimmers[i];
        var row = document.createElement('div');
        row.className = relay ? 'lane-row relay' : 'lane-row';
        // 子节点采用与原模板一致的 class，便于现有 CSS 继续生效
        row.innerHTML =
            '<div class="lane-num"></div>' +
            '<div class="swimmer-name"></div>' +
            '<div class="swimmer-team"></div>' +
            '<div class="age-group"></div>' +     // 2026-06-04 加 组别 列
            '<div class="result-time"></div>' +
            '<div class="rank"></div>' +
            '<div class="remark"></div>';
        container.appendChild(row);
        _raceRowDOM.push({
            lane: sw.lane,
            row: row,
            laneNum: row.children[0],
            nameEl: row.children[1],
            teamEl: row.children[2],
            ageGroupEl: row.children[3],         // 2026-06-04 新增 ref
            resultEl: row.children[4],
            rankEl: row.children[5],
            remarkEl: row.children[6],
            lastClass: '', lastResult: null, lastResultColor: '', lastRank: null, lastRankClass: '',
            lastRemark: null, lastRemarkColor: '',
            lastNameHtml: null, lastTeamHtml: null,
            lastAgeGroup: null,
            lastLaneNum: null
        });
    }
    _raceRowsBuiltKey = key;
}

// 字段刷新：只写真正变化的字段（textContent / className / innerHTML）
function _refreshRaceRows() {
    var swimmers = _activeSwimmersForDisplay();
    var relay = !!_raceHeaderRelay;
    var now = Date.now();
    var displayTime = (data.laneCloseSettings ? data.laneCloseSettings.splitDisplayTime : 5) || 5;
    var displayMs = displayTime * 1000;

    // 分段名次：直接使用服务器广播的 sw.rank，与三个计时控制端完全同源
    // （服务器在 ComputeLiveRanks 中按"已完赛优先 → 有效分段数倒序 → 累计时间升序"统一计算 +
    //   并列名次 1-2-2-4，已涵盖接力的真实进度）
    var splitRanks = {};
    for (var i = 0; i < swimmers.length; i++) {
        var s = swimmers[i];
        if (s && s.lane != null && s.rank > 0) splitRanks[s.lane] = s.rank;
    }

    for (var i3 = 0; i3 < swimmers.length && i3 < _raceRowDOM.length; i3++) {
        var sw = swimmers[i3];
        var ui = _raceRowDOM[i3];
        if (!ui) continue;
        var lane = sw.lane;

        if (!laneDisplayState[lane]) laneDisplayState[lane] = {splitCount: 0, showTime: 0, lastReactionSeq: -1, lastReactionStr: '', reactionShowAt: 0};
        var ls = laneDisplayState[lane];

        var rawSplitCount = (sw.splits ? sw.splits.length : 0);
        var rsi2 = _realSplitInfoOf(sw);
        var realSplitCount = rsi2.count;
        var lastRealSplitStr = rsi2.last;
        var hasReaction = sw.reactionTime && sw.reactionTime !== '';
        // 检测"新一棒反应时"，同时给两条触发路径以兼容新旧服务器：
        //   (1) 优先使用服务器送来的 reactionSeq（每次写 ReactionTime 自增）
        //   (2) 老服务器无 reactionSeq 字段时，退回比较 reactionTime 字符串
        if (hasReaction) {
            var seq = (typeof sw.reactionSeq === 'number') ? sw.reactionSeq : null;
            var trig = false;
            if (seq !== null) {
                if (seq !== ls.lastReactionSeq) { ls.lastReactionSeq = seq; trig = true; }
            } else {
                if (sw.reactionTime !== ls.lastReactionStr) trig = true;
            }
            if (sw.reactionTime !== ls.lastReactionStr) ls.lastReactionStr = sw.reactionTime;
            if (trig) ls.reactionShowAt = now;
        }
        if (realSplitCount > ls.splitCount) { ls.splitCount = realSplitCount; ls.showTime = now; }

        // 行类名
        var classes = 'lane-row';
        if (relay) classes += ' relay';   // 2026-05-31 与 _ensureRaceRowsDom 创建时一致, 触发接力专用列宽/顺序
        if (sw.isFinished) classes += ' finished';
        if (sw.status === 'DNS') classes += ' dns';
        if (sw.status === 'DSQ') classes += ' dsq';
        if (sw.status === 'TRI') classes += ' tri';   // 2026-06-04 试游, 红色下边框 (与 dns/dsq 同款)
        if (sw.status === 'EMPTY') classes += ' empty';   // 2026-05-27 空道淡显
        if (ui.lastClass !== classes) { ui.row.className = classes; ui.lastClass = classes; }

        // 道次
        var laneStr = (lane != null ? String(lane) : '');
        if (ui.lastLaneNum !== laneStr) { ui.laneNum.textContent = laneStr; ui.lastLaneNum = laneStr; }

        // 姓名 / 代表队列
        // 接力：左列=代表队(窄)，右列= 4 棒+姓名同列显示, 当前棒高亮金色 (按当前圈数推算, 跟随加减圈刷新)
        // 2026-06-05 代表队 显中文全名 (country), 不再用 countryShort (TTYYD 等英文码)
        var teamDisplay = sw.country || sw.countryShort || '';
        var col1Html, col2Html;
        if (relay) {
            col1Html = teamDisplay;
            col2Html = getRelayAllLegNames(sw);
        } else {
            col1Html = sw.name || '';
            col2Html = teamDisplay;
        }
        if (ui.lastNameHtml !== col1Html) { ui.nameEl.innerHTML = col1Html; ui.lastNameHtml = col1Html; }
        if (ui.lastTeamHtml !== col2Html) { ui.teamEl.innerHTML = col2Html; ui.lastTeamHtml = col2Html; }
        // 2026-06-04 组别列: 显 swimmer.ageGroup (= 服务器 sw.AgeCategory). 并组时区分不同组别
        var ageStr = sw.ageGroup || '';
        if (ui.lastAgeGroup !== ageStr && ui.ageGroupEl) { ui.ageGroupEl.textContent = ageStr; ui.lastAgeGroup = ageStr; }

        // 成绩 / 名次
        // 2026-06-04 TRI 同 DSQ 一样接收硬件数据 + 显成绩, 但 名次列 始终为空 (不参与排名)
        var resultText = '', rankText = '', rankClass = '';
        var isTri = sw.status === 'TRI';
        if (sw.status === 'DNS' || sw.status === 'DNF' || sw.status === 'DSQ') {
            // DNS/DNF/DSQ 不显示成绩
        } else if (sw.isFinished && sw.finalTime) {
            resultText = sw.finalTime;
            if (!isTri) {     // TRI 不显名次
                if (sw.rank === 1) { rankClass = 'gold'; rankText = sw.rank; }
                else if (sw.rank === 2) { rankClass = 'silver'; rankText = sw.rank; }
                else if (sw.rank === 3) { rankClass = 'bronze'; rankText = sw.rank; }
                else if (sw.rank > 0) { rankText = sw.rank; }
            }
        } else {
            var elapsed = now - ls.showTime;
            if (ls.showTime > 0 && elapsed < displayMs && realSplitCount > 0) {
                resultText = lastRealSplitStr;
                if (splitRanks[lane] && !isTri) {     // TRI 不显分段名次
                    rankText = splitRanks[lane];
                    // 与终点态保持一致的奖牌色
                    if (rankText === 1) rankClass = 'gold';
                    else if (rankText === 2) rankClass = 'silver';
                    else if (rankText === 3) rankClass = 'bronze';
                }
            }
            // 反应时不再写入成绩栏 — 改到下方"备注栏"显示，时长与 splitDisplayTime 相同
        }
        if (ui.lastResult !== resultText) { ui.resultEl.textContent = resultText; ui.lastResult = resultText; }
        // 成绩栏不再承载反应时，统一不染色
        if (ui.lastResultColor !== '') { ui.resultEl.style.color = ''; ui.lastResultColor = ''; }
        var rankStr = rankText !== '' ? String(rankText) : '';
        if (ui.lastRank !== rankStr) { ui.rankEl.textContent = rankStr; ui.lastRank = rankStr; }
        var rankClsFull = 'rank' + (rankClass ? ' ' + rankClass : '');
        if (ui.lastRankClass !== rankClsFull) { ui.rankEl.className = rankClsFull; ui.lastRankClass = rankClsFull; }

        // 备注栏（优先级，从高到低）：
        //   1) 判罚 DSQ/DNS/DNF/DQ — 红色（裁判一标注就实时显示，不等待成绩确认）
        //   2) 破/平纪录 recordNote — 金色
        //   3) 反应时显示窗口（最近一次 reactionSeq 触发后的 splitDisplayTime 秒内）— 抢跳可疑标红，否则正常色
        // 前两类不会被反应时覆盖，符合"犯规等信息持续显示"的要求。
        var remarkText = '', remarkColor = '';
        if (sw.status === 'DSQ' || sw.status === 'DQ') { remarkText = 'DSQ'; remarkColor = ''; }     // 默认红（CSS .remark）
        else if (sw.status === 'DNS') { remarkText = 'DNS'; remarkColor = ''; }
        else if (sw.status === 'DNF') { remarkText = 'DNF'; remarkColor = ''; }
        else if (sw.status === 'TRI') { remarkText = 'TRI'; remarkColor = ''; }   // 2026-06-04 试游, 与 DSQ/DNS 同款显示
        if (!remarkText && sw.recordNote) { remarkText = sw.recordNote; remarkColor = '#fbbf24'; }
        // 2026-06-04 备注栏 是否显示 出发反应时 由 control 端开关 (_remarkShowReaction, 默认 true).
        //   关掉后 反应时不进备注栏 (但 sw.reactionTime 数据仍在, 只是 UI 隐藏)
        if (!remarkText && hasReaction && ls.reactionShowAt > 0 && (now - ls.reactionShowAt) < displayMs && _remarkShowReaction) {
            remarkText = sw.reactionTime;
            remarkColor = (sw.isSuspectFalseStart || sw.isFalseStart) ? '#ef4444' : '#f8fafc';
        }
        if (ui.lastRemark !== remarkText) { ui.remarkEl.textContent = remarkText; ui.lastRemark = remarkText; }
        if (ui.lastRemarkColor !== remarkColor) { ui.remarkEl.style.color = remarkColor; ui.lastRemarkColor = remarkColor; }
    }
}

function renderStartList() {
    document.getElementById('listView').classList.remove('hidden');
    var lv = document.getElementById('listView');
    // 2026-06-03 标题加 margin-top + 增大 margin-bottom, 让 运动会名/项目名次/表头 三行不再挤
    // 2026-06-04 顺序统一: 性别 组别 项目 赛次 组数

// 判断该泳道占位记录是否真有运动员
// 空泳道占位记录由后端用 status === 'EMPTY' 显式标识，必须先排除
// （以前误把 status='EMPTY' 当作"非空状态"而保留 0 道空行）
function isOccupiedLane(s) {
    if (!s) return false;
    if (s.status === 'EMPTY') return false;     // 后端空泳道占位
    if (s.bibNumber) return true;
    if (s.name && s.name !== '') return true;
    if (s.country && s.country !== '') return true;
    if (s.finalTime && s.finalTime !== '') return true;
    if (s.status && s.status !== '') return true;
    return false;
}

var _rankingPageTimer = null;
var _rankingCurrentPage = 0;
var _rankingTotalPages = 1;
var _rankingRowsPerPage = 10;
var _rankingPageInterval = 5000; // 默认5秒；以参数设置中"大屏翻屏时间"为准

// 取当前生效的翻屏时间（毫秒）；data.laneCloseSettings.bigDisplayPageInterval 单位是秒
function getBigDisplayPageIntervalMs() {
    var sec = 5;
    if (data && data.laneCloseSettings && typeof data.laneCloseSettings.bigDisplayPageInterval !== 'undefined') {
        var v = parseFloat(data.laneCloseSettings.bigDisplayPageInterval);
        if (!isNaN(v) && v > 0) sec = v;
    }
    return sec * 1000;
}

function renderEventRanking() {
    if (_rankingPageTimer) { clearInterval(_rankingPageTimer); _rankingPageTimer = null; }

    document.getElementById('listView').classList.remove('hidden');
    var erRelay = isRelayEvent();

    // 2026-06-02 并项拆分: eventRankingSplit (服务器按 性别×实际年龄 切的子表) 优先;
    //   有 ≥2 个子表时把每个子表当成 1 页轮播 (每页 = 1 个 子表). 单一子表/无 split 退回旧版.
    var split = (data.eventRankingSplit && data.eventRankingSplit.length > 0) ? data.eventRankingSplit : null;

    _rankingRowsPerPage = 10;
    _rankingPageInterval = getBigDisplayPageIntervalMs();

    if (split && split.length >= 1) {
        // 每个 子表自身需要 ≥1 页, 子表内行数 >10 时该子表再切多页. 用一个扁平的 pages 数组,
        //   每页记 (subIdx, internalPage) 一对.
        _rankingPages = [];
        for (var si = 0; si < split.length; si++) {
            var items = (split[si].items || []);
            var inner = Math.max(1, Math.ceil(items.length / _rankingRowsPerPage));
            for (var ip = 0; ip < inner; ip++) _rankingPages.push({ s: si, p: ip });
        }
        _rankingTotalPages = _rankingPages.length;
        _rankingCurrentPage = 0;
        _rankingSplit = split;
        showRankingPageSplit();
        if (_rankingTotalPages > 1) {
            _rankingPageTimer = setInterval(function() {
                _rankingCurrentPage = (_rankingCurrentPage + 1) % _rankingTotalPages;
                showRankingPageSplit();
            }, _rankingPageInterval);
        }
        return;
    }

    // 旧版回退: 单表分页 (无 split 数据 / 服务器旧版本)
    var er = data.eventRanking || [];
    _rankingTotalPages = Math.max(1, Math.ceil(er.length / _rankingRowsPerPage));
    _rankingCurrentPage = 0;
    _rankingSplit = null;
    showRankingPage(er, erRelay);
    if (_rankingTotalPages > 1) {
        _rankingPageTimer = setInterval(function() {
            _rankingCurrentPage = (_rankingCurrentPage + 1) % _rankingTotalPages;
            showRankingPage(er, erRelay);
        }, _rankingPageInterval);
    }
}

    html += '<table class="list-table"><thead><tr><th style="width:10%;">名次</th><th style="width:14%;">组/道</th><th>' + erH1 + '</th><th>' + erH2 + '</th><th style="width:16%;">成绩</th><th style="width:14%;">备注</th></tr></thead><tbody>';
    var start = cur.p * _rankingRowsPerPage;
    var end = Math.min(start + _rankingRowsPerPage, items.length);
    for (var i = start; i < end; i++) {
        var it = items[i];
        var c1 = erRelay ? (it.country || '') : (it.name || '');
        var c2 = erRelay ? (it.name || '') : (it.country || '');
        var rkText = it.rank > 0 ? it.rank : '-';
        var remarkHtml = buildEventRankingRemarkHtml(it);
        // 2026-06-03 lane=0 是 10 道泳池的合法道号 (lanes 0-9), 不能当缺失处理. 用 != null 区分 "未提供" 和 "实际是 0"
        var hlText = ((it.heat || 0) > 0 ? it.heat : '-') + ' / ' + (it.lane != null && it.lane !== '' ? it.lane : '-');
        // 2026-06-03 td 加 t-rank/t-lane/t-name/t-team/t-result/t-remark class, 让颜色/字体 = 比赛视图 同款
        var rkClass = it.rank === 1 ? 't-rank gold' : it.rank === 2 ? 't-rank silver' : it.rank === 3 ? 't-rank bronze' : 't-rank';

        html += '<tr><td class="' + rkClass + '">' + rkText + '</td><td class="t-lane">' + hlText + '</td><td class="' + c1Class + '">' + c1 + '</td><td class="' + c2Class + '">' + c2 + '</td><td class="t-result">' + (it.finalTime || '') + '</td><td class="t-remark">' + remarkHtml + '</td></tr>';
    }
    html += '</tbody></table>';
    if (_rankingTotalPages > 1) {
        // 页码: 子表 m/n + 内部 p/q, 让操作员一眼看出现在是第几个子表
        html += '<div class="page-indicator">'
            + '子表 ' + (cur.s + 1) + '/' + _rankingSplit.length
            + (innerTotal > 1 ? ('  内 ' + (cur.p + 1) + '/' + innerTotal) : '')
            + '  总 ' + (_rankingCurrentPage + 1) + '/' + _rankingTotalPages
            + '</div>';
    }
    lv.innerHTML = html;
}

// 2026-06-01 总排名"备注"列拼装: 状态(DSQ/DNS/DNF/TRI 红) > 晋级 Q (绿) + 破纪录 WR/CR/... (金), 多个用 ' \ ' 隔开
function buildEventRankingRemarkHtml(item) {
    var status = (item && (item.resultStatus || item.status)) || '';
    if (status === 'DSQ' || status === 'DNS' || status === 'DNF' || status === 'DQ' || status === 'TRI') {
        return '<span style="color:#ef4444;font-weight:bold;">' + status + '</span>';
    }
    var parts = [];
    if (item && item.qualifiedToNext) parts.push('<span style="color:#22c55e;font-weight:bold;">Q</span>');
    var rn = (item && item.recordNote) ? String(item.recordNote).trim() : '';
    if (rn) {
        var tags = rn.split(/[\/、,，\s]+/);
        for (var j = 0; j < tags.length; j++) {
            if (tags[j]) parts.push('<span style="color:#fbbf24;font-weight:bold;">' + tags[j] + '</span>');
        }
    }
    return parts.length ? parts.join(' \\ ') : '';
}

function showRankingPage(er, erRelay) {
    var lv = document.getElementById('listView');
    var erH1 = erRelay ? '代表队' : '姓名';
    var erH2 = erRelay ? '姓名' : '代表队';

    // 2026-06-03 标题加 margin-top + 增大 margin-bottom, 让 运动会名/项目名次/表头 三行不再挤
    // 2026-06-04 顺序统一: 性别 组别 项目 赛次
    var html = '<h2 style="margin:0 0 0.5vh 0;padding-bottom:0.5vh;border-bottom:3px solid var(--accent);font-size:calc(2.8vh * var(--fs) * var(--fs-event));color:var(--c-event);font-family:var(--ff-event);font-weight:bold;">' + fmtGender(data.currentGender) + ' ' + ((data.currentAgeGroup||'') ? (data.currentAgeGroup+' ') : '') + (data.currentEvent||'') + ' ' + (data.currentStage||'') + ' 总排名</h2>';
    // 2026-06-05 项目名称下 显示 本项目所有组别 纪录 (inline 行)
    if (data.applicableRecords && data.applicableRecords.length > 0) {
        html += '<div style="display:flex;flex-wrap:wrap;gap:0.4vh 2.4vw;padding:0.4vh 0.5vw;margin-bottom:0.4vh;font-size:calc(1.6vh * var(--fs) * var(--fs-info));color:#FBBF24;font-family:var(--ff-info);font-weight:bold;border-bottom:1px dashed rgba(251,191,36,0.4);">';
        for (var ri = 0; ri < data.applicableRecords.length; ri++) {
            var rec = data.applicableRecords[ri];
            var lab = (rec.tag||'') + (rec.ageGroup ? rec.ageGroup.replace('岁组','') : '');
            html += '<span style="white-space:nowrap;"><span style="color:#FCD34D;margin-right:0.3vw;">' + lab + '</span><span style="color:#FEF3C7;font-family:Consolas,monospace;">' + (rec.time||'') + '</span></span>';
        }
        html += '</div>';
    }
    // 2026-06-01 总排名: 去掉"号码"栏, 加"备注"栏 (Q 晋级 + WR/CR/...破纪录, 用 ' \ ' 隔开)
    // 2026-06-02 名次后加 "组/道" 栏 (heat/lane), 让选手一眼看出在哪组哪道游的
    html += '<table class="list-table"><thead><tr><th style="width:10%;">名次</th><th style="width:14%;">组/道</th><th>' + erH1 + '</th><th>' + erH2 + '</th><th style="width:16%;">成绩</th><th style="width:14%;">备注</th></tr></thead><tbody>';

    var start = _rankingCurrentPage * _rankingRowsPerPage;
    var end = Math.min(start + _rankingRowsPerPage, er.length);
    for (var i = start; i < end; i++) {
        var erc1 = erRelay ? (er[i].country||'') : (er[i].name||'');
        var erc2 = erRelay ? (er[i].name||'') : (er[i].country||'');
        var erkText = er[i].rank > 0 ? er[i].rank : '-';
        var remarkHtml = buildEventRankingRemarkHtml(er[i]);
        // 2026-06-03 lane=0 是 10 道泳池的合法道号 (lanes 0-9), 不能当缺失处理
        var hlText = ((er[i].heat||0) > 0 ? er[i].heat : '-') + ' / ' + (er[i].lane != null && er[i].lane !== '' ? er[i].lane : '-');
        // 2026-06-03 td 加 t-rank/t-lane/t-name/t-team/t-result/t-remark class, 颜色/字体 = 比赛视图 同款
        var rkCls = er[i].rank === 1 ? 't-rank gold' : er[i].rank === 2 ? 't-rank silver' : er[i].rank === 3 ? 't-rank bronze' : 't-rank';
        var c1Cls = erRelay ? 't-team' : 't-name';
        var c2Cls = erRelay ? 't-name' : 't-team';
        // 2026-06-02 DSQ/DNS/DNF 不再回退到成绩栏 (已由 备注 栏显示, 避免重复)
        html += '<tr><td class="' + rkCls + '">' + erkText + '</td><td class="t-lane">' + hlText + '</td><td class="' + c1Cls + '">' + erc1 + '</td><td class="' + c2Cls + '">' + erc2 + '</td><td class="t-result">' + (er[i].finalTime || '') + '</td><td class="t-remark">' + remarkHtml + '</td></tr>';
    }
    html += '</tbody></table>';

    if (_rankingTotalPages > 1) {
        html += '<div class="page-indicator">' + (_rankingCurrentPage + 1) + ' / ' + _rankingTotalPages + '</div>';
    }
    lv.innerHTML = html;
}

// 2026-06-03 裁判介绍 视图: 渲染 data.refereeList (= 服务器 _staff 里 Group=裁判员 的成员)
function renderReferees() {
    document.getElementById('listView').classList.remove('hidden');
    var lv = document.getElementById('listView');
    var html = '<h2 style="margin:0 0 0.5vh 0;padding-bottom:0.5vh;border-bottom:3px solid var(--accent);font-size:calc(2.8vh * var(--fs) * var(--fs-event));color:var(--c-event);font-family:var(--ff-event);font-weight:bold;">裁判员介绍</h2>';
    html += '<table class="list-table"><thead><tr><th style="width:30%;">岗位</th><th style="width:18%;">姓名</th><th style="width:30%;">工作单位</th><th style="width:22%;">裁判等级</th></tr></thead><tbody>';
    var rf = data.refereeList || [];
    if (rf.length === 0) {
        html += '<tr><td colspan="4" style="text-align:center;color:var(--dim);">暂无裁判员数据 (请在 "工作人员管理 → 裁判员" 添加)</td></tr>';
    } else {
        for (var i = 0; i < rf.length; i++) {
            html += '<tr>'
                + '<td>' + (rf[i].title || '') + '</td>'
                + '<td>' + (rf[i].name || '') + '</td>'
                + '<td>' + (rf[i].country || '') + '</td>'
                + '<td>' + (rf[i].refereeLevel || '') + '</td>'
                + '</tr>';
        }
    }
    html += '</tbody></table>';
    lv.innerHTML = html;
}

function renderAwards() {
    document.getElementById('awardView').classList.remove('hidden');
    // 2026-06-04 顺序统一: 性别 组别 项目
    document.getElementById('awardTitle').textContent = fmtGender(data.currentGender) + ' ' + ((data.currentAgeGroup||'') ? (data.currentAgeGroup+' ') : '') + (data.currentEvent||'') + ' 颁奖典礼';
    var container = document.getElementById('awardContainer');
    container.innerHTML = '';
    var er = data.eventRanking || [];
    var medals = ['silver','gold','bronze'];
    var icons = ['\uD83E\uDD48','\uD83E\uDD47','\uD83E\uDD49'];
    var order = [1,0,2]; // silver, gold, bronze display order
    for (var i = 0; i < 3 && i < er.length; i++) {
        var idx = order[i];
        if (idx >= er.length) continue;
        var card = document.createElement('div');
        card.className = 'podium-card ' + medals[i];
        var awRelay = isRelayEvent();
        var awName = awRelay ? (er[idx].country||'') : (er[idx].name||'');
        var awTeam = awRelay ? (er[idx].name||'') : (er[idx].country||'');
        card.innerHTML = '<div class="medal">' + icons[i] + '</div><div class="name">' + awName + '</div><div class="team">' + awTeam + '</div><div class="time">' + (er[idx].finalTime||'') + '</div>';
        container.appendChild(card);
    }
}

function renderWelcome() {
    document.getElementById('welcomeView').classList.remove('hidden');
    document.getElementById('welcomeTitle').textContent = data.competitionName || '欢迎';
    document.getElementById('welcomeSub').textContent = '';
}

// 启动：先把已知/默认的服务器IP填入遮罩输入框，并立即触发一次连接尝试
(function bootstrap() {
    var inp = document.getElementById('connHostInput');
    if (inp) {
        inp.value = getInitialHost();
        inp.addEventListener('keydown', function(ev) { if (ev.key === 'Enter') overlayConnect(); });
    }
    showConnectOverlay('连接中… ' + getInitialHost() + ':3002', '#f59e0b');
    connect();
})();
</script>
