<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排名显示</title>
<style>
:root {
    --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --dim: #94a3b8; --accent: #3b82f6; --gold: #f59e0b;
    /* 2026-06-01 字号缩放 + 5 处文字 (颜色 + 字体) 单独可调
       localStorage('swimLeaderboardFs')        字号倍数
       localStorage('swimLeaderboardTextStyle') {key:{c,f}} JSON */
    --fs: 1;
    --c-title:   #f8fafc;  --ff-title:   'Microsoft YaHei', sans-serif;
    --c-section: #3b82f6;  --ff-section: 'Microsoft YaHei', sans-serif;
    --c-th:      #f8fafc;  --ff-th:      'Microsoft YaHei', sans-serif;
    --c-td:      #f8fafc;  --ff-td:      'Microsoft YaHei', sans-serif;
    --c-remark:  #ef4444;  --ff-remark:  'Microsoft YaHei', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Microsoft YaHei', sans-serif; height: 100vh; overflow: hidden; }
.header { height: 10vh; display: flex; align-items: center; justify-content: center; border-bottom: 3px solid var(--accent); }
.header h1 { font-size: calc(3vh * var(--fs)); color: var(--c-title); font-family: var(--ff-title); }
.content { height: 90vh; padding: 2vh 3vw; overflow-y: auto; }
.section-title { font-size: calc(2.5vh * var(--fs)); font-weight: bold; margin: 2vh 0 1vh; color: var(--c-section); font-family: var(--ff-section); }
table { width: 100%; border-collapse: collapse; margin-bottom: 2vh; }
th { background: var(--card); padding: 1vh 1vw; text-align: left; font-size: calc(1.8vh * var(--fs)); border-bottom: 2px solid var(--accent); color: var(--c-th); font-family: var(--ff-th); }
td { padding: 0.8vh 1vw; font-size: calc(1.8vh * var(--fs)); border-bottom: 1px solid #334155; color: var(--c-td); font-family: var(--ff-td); }
tr:hover { background: rgba(59,130,246,0.05); }
.rank-1 { color: var(--gold); font-weight: bold; }
.rank-2 { color: #c0c0c0; font-weight: bold; }
.rank-3 { color: #cd7f32; font-weight: bold; }
td.lb-remark { color: var(--c-remark); font-family: var(--ff-remark); font-weight: bold; }
.tabs { display: flex; gap: 1vw; margin-bottom: 2vh; }
.tab { padding: 0.8vh 2vw; background: var(--card); border-radius: 4px; cursor: pointer; font-size: calc(1.8vh * var(--fs)); }
.tab.active { background: var(--accent); }
/* 2026-05-27 底色设置色板 */
.bg-swatch-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:0.7vh; }
.bg-swatch { height:5.2vh; border-radius:5px; cursor:pointer; border:1px solid #334155;
             display:flex; align-items:flex-end; justify-content:center; padding-bottom:0.25vh;
             font-size:1.25vh; color:rgba(248,250,252,0.85); text-shadow:0 1px 2px rgba(0,0,0,0.6);
             transition:transform .12s; }
.bg-swatch:hover { transform:scale(1.06); }
.bg-swatch.sel { outline:2px solid #3b82f6; outline-offset:1px; }
.hidden { display:none; }
</style>
</head>
<body>
<div class="header" style="display:flex;justify-content:space-between;align-items:center;">
    <h1 id="title" style="margin:0;">排名显示</h1>
    <button class="fullscreen-btn" onclick="goFullScreen()" style="padding:4px 12px;background:#3B82F6;color:white;border:none;border-radius:4px;font-size:12px;cursor:pointer;">全屏</button>
</div>
<div class="content">
    <div class="tabs">
        <div class="tab active" onclick="showTab('ranking')">项目排名</div>
        <div class="tab" onclick="showTab('team')">团体积分</div>
        <div class="tab" onclick="showTab('records')">纪录榜</div>
    </div>
    <div id="rankingView"></div>
    <div id="teamView" style="display:none"></div>
    <div id="recordsView" style="display:none"></div>
</div>

<!-- 2026-05-27 排名屏底色设置: 右下角齿轮按钮 → 弹出选色面板. 数据保存在 localStorage('swimLeaderboardBg'), 与大屏 display.html 独立. -->
<button id="bgSettingsBtn" onclick="toggleBgSettings()" title="排名屏底色设置"
        style="position:fixed;right:1.2vw;bottom:1.2vh;width:5.5vh;height:5.5vh;border-radius:50%;background:rgba(30,41,59,0.55);color:#94a3b8;border:1px solid rgba(148,163,184,0.35);font-size:2.6vh;cursor:pointer;z-index:9998;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:opacity .2s;opacity:0.45;"
        onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.45'">⚙</button>
<div id="bgSettingsPanel" class="hidden" style="position:fixed;right:1.2vw;bottom:8vh;width:46vh;max-height:82vh;overflow-y:auto;background:#1e293b;color:#f8fafc;border-radius:10px;padding:2vh 2.2vh;box-shadow:0 8px 36px rgba(0,0,0,.55);z-index:9998;font-family:'Microsoft YaHei',sans-serif;font-size:1.7vh;border:1px solid #334155;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2vh;">
        <div style="font-size:2vh;font-weight:bold;color:#3b82f6;">🎨 排名屏底色</div>
        <button onclick="toggleBgSettings()" style="background:none;border:none;color:#94a3b8;font-size:2.4vh;cursor:pointer;padding:0 0.6vh;">×</button>
    </div>
    <div style="font-size:1.5vh;color:#94a3b8;margin-bottom:0.5vh;font-weight:bold;letter-spacing:1px;">纯色</div>
    <div id="bgGridSolid" class="bg-swatch-grid"></div>
    <div style="font-size:1.5vh;color:#94a3b8;margin:1.2vh 0 0.5vh;font-weight:bold;letter-spacing:1px;">渐变 (层次感)</div>
    <div id="bgGridGradient" class="bg-swatch-grid"></div>
    <div style="font-size:1.5vh;color:#94a3b8;margin:1.2vh 0 0.5vh;font-weight:bold;letter-spacing:1px;">高级混合 (深度感)</div>
    <div id="bgGridMesh" class="bg-swatch-grid"></div>
    <div style="font-size:1.5vh;color:#94a3b8;margin:1.2vh 0 0.5vh;font-weight:bold;letter-spacing:1px;">灰度</div>
    <div id="bgGridGray" class="bg-swatch-grid"></div>
    <div style="font-size:1.5vh;color:#94a3b8;margin:1.2vh 0 0.5vh;font-weight:bold;letter-spacing:1px;">图案</div>
    <div id="bgGridPattern" class="bg-swatch-grid"></div>
    <div style="font-size:1.5vh;color:#94a3b8;margin:1.2vh 0 0.5vh;font-weight:bold;letter-spacing:1px;">自定义</div>
    <div style="display:flex;align-items:center;gap:0.8vh;margin-bottom:0.8vh;">
        <span style="color:#94a3b8;font-size:1.5vh;">颜色:</span>
        <input id="bgCustomPicker" type="color" value="#0f172a" onchange="applyDisplayBg(this.value, true)"
               style="width:4.5vh;height:3.2vh;padding:0;border:1px solid #334155;border-radius:4px;background:transparent;cursor:pointer;"/>
        <input id="bgCustomHex" type="text" maxlength="7" placeholder="#0f172a" onchange="applyDisplayBg(this.value, true)"
               style="flex:1;padding:0.5vh 0.8vh;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:4px;font-family:Consolas,monospace;font-size:1.5vh;"/>
    </div>
    <div style="display:flex;align-items:center;gap:0.8vh;margin-bottom:1vh;">
        <span style="color:#94a3b8;font-size:1.5vh;">图片:</span>
        <input id="bgImageFile" type="file" accept="image/*" onchange="loadCustomBgImage(this.files[0])"
               style="flex:1;font-size:1.4vh;color:#cbd5e1;"/>
    </div>
    <button onclick="applyDisplayBg('#0f172a', true)"
            style="width:100%;padding:0.8vh;background:#475569;color:#f8fafc;border:none;border-radius:4px;cursor:pointer;font-size:1.6vh;">恢复默认 (深邃蓝)</button>
</div>

<!-- 2026-06-01 字号缩放: 0.8x ~ 3.0x. 数据保存在 localStorage('swimLeaderboardFs'). -->
<button id="fsSettingsBtn" onclick="toggleFsSettings()" title="字号 (Ctrl + / Ctrl -)"
        style="position:fixed;right:1.2vw;bottom:7.6vh;width:5.5vh;height:5.5vh;border-radius:50%;background:rgba(30,41,59,0.55);color:#94a3b8;border:1px solid rgba(148,163,184,0.35);font-size:2.4vh;cursor:pointer;z-index:9998;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:opacity .2s;opacity:0.45;font-family:'Microsoft YaHei',sans-serif;font-weight:bold;"
        onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.45'">字</button>
<div id="fsSettingsPanel" class="hidden" style="position:fixed;right:1.2vw;bottom:14.4vh;width:36vh;background:#1e293b;color:#f8fafc;border-radius:10px;padding:2vh 2.2vh;box-shadow:0 8px 36px rgba(0,0,0,.55);z-index:9998;font-family:'Microsoft YaHei',sans-serif;font-size:1.7vh;border:1px solid #334155;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2vh;">
        <div style="font-size:2vh;font-weight:bold;color:#3b82f6;">🔤 字号</div>
        <button onclick="toggleFsSettings()" style="background:none;border:none;color:#94a3b8;font-size:2.4vh;cursor:pointer;padding:0 0.6vh;">×</button>
    </div>
    <div style="display:flex;align-items:center;gap:1.2vh;margin-bottom:1.4vh;">
        <button onclick="bumpFontScale(-0.1)" style="flex:0 0 5.5vh;height:5.5vh;background:#475569;color:#f8fafc;border:none;border-radius:6px;font-size:2.8vh;font-weight:bold;cursor:pointer;">−</button>
        <div id="fsScaleLabel" style="flex:1;text-align:center;font-size:3vh;font-weight:bold;color:#f59e0b;font-family:Consolas,monospace;">1.0x</div>
        <button onclick="bumpFontScale(0.1)" style="flex:0 0 5.5vh;height:5.5vh;background:#475569;color:#f8fafc;border:none;border-radius:6px;font-size:2.8vh;font-weight:bold;cursor:pointer;">+</button>
    </div>
    <button onclick="setFontScale(1.0)" style="width:100%;padding:0.8vh;background:#475569;color:#f8fafc;border:none;border-radius:4px;cursor:pointer;font-size:1.6vh;margin-bottom:0.6vh;">恢复 1.0x</button>
    <div style="font-size:1.4vh;color:#94a3b8;text-align:center;line-height:1.5;">快捷键: <b style="color:#cbd5e1;">Ctrl +</b> / <b style="color:#cbd5e1;">Ctrl −</b> / <b style="color:#cbd5e1;">Ctrl 0</b><br>范围 0.8x ~ 3.0x</div>
</div>

<!-- 2026-06-01 文字样式: 5 处单独调颜色 + 字体. 数据保存在 localStorage('swimLeaderboardTextStyle'). -->
<button id="textStyleBtn" onclick="toggleTextStyle()" title="文字样式 (颜色/字体)"
        style="position:fixed;right:1.2vw;bottom:14vh;width:5.5vh;height:5.5vh;border-radius:50%;background:rgba(30,41,59,0.55);color:#94a3b8;border:1px solid rgba(148,163,184,0.35);font-size:2.4vh;cursor:pointer;z-index:9998;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:opacity .2s;opacity:0.45;font-family:'Microsoft YaHei',sans-serif;font-weight:bold;"
        onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.45'">文</button>
<div id="textStylePanel" class="hidden" style="position:fixed;right:1.2vw;bottom:20.4vh;width:62vh;max-height:70vh;overflow-y:auto;background:#1e293b;color:#f8fafc;border-radius:10px;padding:2vh 2.2vh;box-shadow:0 8px 36px rgba(0,0,0,.55);z-index:9998;font-family:'Microsoft YaHei',sans-serif;font-size:1.6vh;border:1px solid #334155;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2vh;">
        <div style="font-size:2vh;font-weight:bold;color:#3b82f6;">📝 文字样式 (颜色 / 字体)</div>
        <button onclick="toggleTextStyle()" style="background:none;border:none;color:#94a3b8;font-size:2.4vh;cursor:pointer;padding:0 0.6vh;">×</button>
    </div>
    <div id="textStyleRows"></div>
    <button onclick="resetAllTextStyle()" style="width:100%;padding:0.8vh;background:#475569;color:#f8fafc;border:none;border-radius:4px;cursor:pointer;font-size:1.5vh;margin-top:1vh;">全部恢复默认</button>
</div>

<!-- 连接服务器遮罩：启动即显示，连接成功才消隐 -->
<div id="connectOverlay" style="position:fixed;left:0;top:0;width:100vw;height:100vh;background:#0f172aF2;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f8fafc;font-family:'Microsoft YaHei',sans-serif;">
    <div style="background:#1e293b;border-radius:12px;padding:5vh 6vw;min-width:420px;box-shadow:0 8px 30px rgba(0,0,0,.4);">
        <div style="font-size:3vh;font-weight:bold;text-align:center;margin-bottom:2vh;">连接主服务器</div>
        <div style="font-size:1.8vh;color:#94a3b8;margin-bottom:0.6vh;">服务器 IP 地址</div>
        <input id="connHostInput" type="text" placeholder="如 192.168.1.100" autocomplete="off"
               style="width:100%;padding:1.2vh 1vw;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#f8fafc;font-size:2.2vh;outline:none;"/>
        <div style="display:flex;gap:1vw;margin-top:2.5vh;">
            <button id="connBtn" onclick="overlayConnect()"
                    style="flex:1;padding:1.4vh 2vw;background:#22c55e;color:white;border:none;border-radius:6px;font-size:2vh;font-weight:bold;cursor:pointer;">连接</button>
        </div>
        <div id="connStatus" style="margin-top:2vh;text-align:center;font-size:1.8vh;color:#f59e0b;min-height:2.5vh;">请输入主服务器IP并点击连接</div>
    </div>
</div>

<script>
var ws, data = {};
var _pendingData = null;
var _renderScheduled = false;
window.onbeforeunload = function(e) { e.preventDefault(); e.returnValue = ''; return '确定要关闭排名屏？'; };

function goFullScreen() { var el=document.documentElement; if(document.fullscreenElement)return; if(el.requestFullscreen)el.requestFullscreen(); else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen(); else if(el.msRequestFullscreen)el.msRequestFullscreen(); }
document.addEventListener('fullscreenchange', function() { var btns=document.querySelectorAll('.fullscreen-btn'); for(var i=0;i<btns.length;i++) btns[i].style.display=document.fullscreenElement?'none':''; });
document.addEventListener('webkitfullscreenchange', function() { var btns=document.querySelectorAll('.fullscreen-btn'); for(var i=0;i<btns.length;i++) btns[i].style.display=document.webkitFullscreenElement?'none':''; });


var _connFailCount = 0;

function getInitialHost() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('host')) return params.get('host');
    if (location.hostname && location.hostname !== '' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return location.hostname;
    return localStorage.getItem('swimServerHost') || '192.168.1.100';
}
function showConnectOverlay(statusText, statusColor) {
    var ov = document.getElementById('connectOverlay');
    if (ov) ov.style.display = 'flex';
    var st = document.getElementById('connStatus');
    if (st) {
        st.textContent = statusText || '请输入主服务器IP并点击连接';
        st.style.color = statusColor || '#f59e0b';
    }
}
function hideConnectOverlay() {
    var ov = document.getElementById('connectOverlay');
    if (ov) ov.style.display = 'none';
}
function overlayConnect() {
    var inp = document.getElementById('connHostInput');
    var ip = inp ? inp.value.trim() : '';
    if (!ip) { showConnectOverlay('请输入服务器IP', '#ef4444'); return; }
    localStorage.setItem('swimServerHost', ip);
    _connFailCount = 0;
    if (ws) try { ws.close(); } catch(e) {}
    showConnectOverlay('连接中… ' + ip + ':3002', '#f59e0b');
    connect();
}

function applyDisplayBg(value, persist) {
    if (typeof value !== 'string') return;
    var v = value.trim();
    if (!v) return;
    if (/javascript:/i.test(v) || /expression\s*\(/i.test(v)) return;
    document.documentElement.style.setProperty('--bg', v);
    if (persist) {
        try { localStorage.setItem('swimLeaderboardBg', v); }
        catch(e) { alert('保存失败: 图片/数据太大无法存入 localStorage. 请用更小的图片.'); }
    }
    var isHex = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v);
    var picker = document.getElementById('bgCustomPicker');
    var hex = document.getElementById('bgCustomHex');
    if (isHex) {
        if (picker && v.length === 7) picker.value = v;
        if (hex) hex.value = v;
    }
    _refreshBgSwatchSelection(v);
}

function loadCustomBgImage(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { alert('请选择图片文件'); return; }
    if (file.size > 2 * 1024 * 1024) {
        if (!confirm('图片较大 (' + Math.round(file.size/1024) + 'KB), 可能因 localStorage 限制(~5MB)存不下. 继续?')) return;
    }
    var reader = new FileReader();
    reader.onload = function(e) {
        var dataUri = e.target.result;
        var bgValue = "url('" + dataUri + "') center center / cover no-repeat fixed, #0f172a";
        applyDisplayBg(bgValue, true);
    };
    reader.onerror = function() { alert('读取图片失败'); };
    reader.readAsDataURL(file);
}

function _refreshBgSwatchSelection(active) {
    var ids = ['bgGridSolid','bgGridGradient','bgGridMesh','bgGridGray','bgGridPattern'];
    for (var g = 0; g < ids.length; g++) {
        var grid = document.getElementById(ids[g]);
        if (!grid) continue;
        var nodes = grid.children;
        for (var i = 0; i < nodes.length; i++) {
            var n = nodes[i];
            if (n.getAttribute('data-value') === active) n.classList.add('sel');
            else n.classList.remove('sel');
        }
    }
}

function _fillBgGrid(gridId, presets) {
    var grid = document.getElementById(gridId);
    if (!grid) return;
    grid.innerHTML = '';
    for (var i = 0; i < presets.length; i++) {
        var p = presets[i];
        var sw = document.createElement('div');
        sw.className = 'bg-swatch';
        sw.setAttribute('data-value', p.value);
        sw.title = p.name;
        sw.style.background = p.value;
        sw.textContent = p.name;
        (function(v){ sw.onclick = function(){ applyDisplayBg(v, true); }; })(p.value);
        grid.appendChild(sw);
    }
}

function _initBgSwatches() {
    _fillBgGrid('bgGridSolid', BG_PRESETS_SOLID);
    _fillBgGrid('bgGridGradient', BG_PRESETS_GRADIENT);
    _fillBgGrid('bgGridMesh', BG_PRESETS_MESH);
    _fillBgGrid('bgGridGray', BG_PRESETS_GRAY);
    _fillBgGrid('bgGridPattern', BG_PRESETS_PATTERN);
}

function toggleBgSettings() {
    var panel = document.getElementById('bgSettingsPanel');
    if (!panel) return;
    if (panel.classList.contains('hidden')) {
        _initBgSwatches();
        var current = localStorage.getItem('swimLeaderboardBg') || '#0f172a';
        _refreshBgSwatchSelection(current);
        if (/^#[0-9a-fA-F]{6}$/.test(current)) {
            var picker = document.getElementById('bgCustomPicker');
            var hex = document.getElementById('bgCustomHex');
            if (picker) picker.value = current;
            if (hex) hex.value = current;
        }
        panel.classList.remove('hidden');
    } else {
        panel.classList.add('hidden');
    }
}

// ═══════ 2026-06-01 字号缩放 (0.8x ~ 3.0x) ═══════
// localStorage('swimLeaderboardFs') 持久化; 快捷键 Ctrl+/Ctrl-/Ctrl0
var FS_MIN = 0.8, FS_MAX = 3.0, FS_STEP = 0.1;
function _clampFs(v) { v = Math.round(v * 10) / 10; return Math.max(FS_MIN, Math.min(FS_MAX, v)); }
function getFontScale() {
    try {
        var v = parseFloat(localStorage.getItem('swimLeaderboardFs') || '1');
        if (isNaN(v) || v <= 0) v = 1;
        return _clampFs(v);
    } catch(e) { return 1; }
}
function setFontScale(v) {
    v = _clampFs(v);
    try { localStorage.setItem('swimLeaderboardFs', String(v)); } catch(e) {}
    document.documentElement.style.setProperty('--fs', v);
    var lab = document.getElementById('fsScaleLabel');
    if (lab) lab.textContent = v.toFixed(1) + 'x';
}
function bumpFontScale(delta) { setFontScale(getFontScale() + delta); }
function toggleFsSettings() {
    var panel = document.getElementById('fsSettingsPanel');
    if (!panel) return;
    if (panel.classList.contains('hidden')) {
        var lab = document.getElementById('fsScaleLabel');
        if (lab) lab.textContent = getFontScale().toFixed(1) + 'x';
        panel.classList.remove('hidden');
    } else {
        panel.classList.add('hidden');
    }
}
(function() { setFontScale(getFontScale()); })();
document.addEventListener('keydown', function(e) {
    if (!e.ctrlKey) return;
    if (e.key === '+' || e.key === '=' || e.code === 'NumpadAdd') { e.preventDefault(); bumpFontScale(FS_STEP); }
    else if (e.key === '-' || e.code === 'NumpadSubtract') { e.preventDefault(); bumpFontScale(-FS_STEP); }
    else if (e.key === '0' || e.code === 'Numpad0') { e.preventDefault(); setFontScale(1.0); }
});

// ═══════ 2026-06-01 5 处文字 (颜色 + 字体) 独立配置 ═══════
// localStorage('swimLeaderboardTextStyle') = {key:{c:'#..',f:'..'}}
var TEXT_KEYS = [
    {k:'title',   label:'比赛名称', dC:'#f8fafc', dF:"'Microsoft YaHei', sans-serif"},
    {k:'section', label:'项目标题', dC:'#3b82f6', dF:"'Microsoft YaHei', sans-serif"},
    {k:'th',      label:'表头',     dC:'#f8fafc', dF:"'Microsoft YaHei', sans-serif"},
    {k:'td',      label:'表内容',   dC:'#f8fafc', dF:"'Microsoft YaHei', sans-serif"},
    {k:'remark',  label:'备注',     dC:'#ef4444', dF:"'Microsoft YaHei', sans-serif"}
];
var FONT_OPTIONS = [
    {label:'微软雅黑', value:"'Microsoft YaHei', sans-serif"},
    {label:'黑体',     value:"SimHei, sans-serif"},
    {label:'宋体',     value:"SimSun, serif"},
    {label:'楷体',     value:"KaiTi, serif"},
    {label:'仿宋',     value:"FangSong, serif"},
    {label:'隶书',     value:"LiSu, serif"},
    {label:'幼圆',     value:"YouYuan, sans-serif"},
    {label:'Arial',    value:"Arial, sans-serif"},
    {label:'Consolas (等宽)', value:"Consolas, monospace"},
    {label:'Impact',   value:"Impact, sans-serif"}
];
function _getTextStyleState() {
    try { return JSON.parse(localStorage.getItem('swimLeaderboardTextStyle') || '{}') || {}; }
    catch(e) { return {}; }
}
function _saveTextStyleState(s) {
    try { localStorage.setItem('swimLeaderboardTextStyle', JSON.stringify(s)); } catch(e) {}
}
function setTextColor(key, color, persist) {
    if (!color) return;
    color = String(color).trim();
    if (!/^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(color)) return;
    document.documentElement.style.setProperty('--c-' + key, color);
    if (persist) {
        var s = _getTextStyleState();
        if (!s[key]) s[key] = {};
        s[key].c = color;
        _saveTextStyleState(s);
    }
    var picker = document.getElementById('tsColor-' + key);
    var hex = document.getElementById('tsHex-' + key);
    if (picker && /^#[0-9a-fA-F]{6}$/.test(color)) picker.value = color;
    if (hex) hex.value = color;
}
function setTextFont(key, fontValue, persist) {
    if (!fontValue) return;
    document.documentElement.style.setProperty('--ff-' + key, fontValue);
    if (persist) {
        var s = _getTextStyleState();
        if (!s[key]) s[key] = {};
        s[key].f = fontValue;
        _saveTextStyleState(s);
    }
    var sel = document.getElementById('tsFont-' + key);
    if (sel) sel.value = fontValue;
}
function resetTextStyle(key) {
    var def = null;
    for (var i = 0; i < TEXT_KEYS.length; i++) if (TEXT_KEYS[i].k === key) { def = TEXT_KEYS[i]; break; }
    if (!def) return;
    setTextColor(key, def.dC, true);
    setTextFont(key, def.dF, true);
}
function resetAllTextStyle() {
    if (!confirm('确定恢复全部 5 处文字 (颜色+字体) 为默认?')) return;
    for (var i = 0; i < TEXT_KEYS.length; i++) resetTextStyle(TEXT_KEYS[i].k);
}
function _buildTextStylePanelRows() {
    var host = document.getElementById('textStyleRows');
    if (!host || host.dataset.built === '1') return;
    var s = _getTextStyleState();
    var html = '';
    for (var i = 0; i < TEXT_KEYS.length; i++) {
        var def = TEXT_KEYS[i];
        var saved = s[def.k] || {};
        var c = saved.c || def.dC;
        var f = saved.f || def.dF;
        var fontOpts = '';
        var matchedFont = false;
        for (var j = 0; j < FONT_OPTIONS.length; j++) {
            var fo = FONT_OPTIONS[j];
            var sel = (fo.value === f) ? ' selected' : '';
            if (sel) matchedFont = true;
            fontOpts += '<option value="' + fo.value.replace(/"/g,'&quot;') + '"' + sel + '>' + fo.label + '</option>';
        }
        if (!matchedFont) fontOpts = '<option value="' + f.replace(/"/g,'&quot;') + '" selected>自定义</option>' + fontOpts;
        html +=
            '<div style="display:flex;align-items:center;gap:0.7vh;margin-bottom:0.7vh;padding:0.6vh 0.4vh;border-bottom:1px solid #334155;">' +
                '<span style="flex:0 0 8vh;color:#cbd5e1;font-size:1.6vh;">' + def.label + '</span>' +
                '<input id="tsColor-' + def.k + '" type="color" value="' + (/^#[0-9a-fA-F]{6}$/.test(c)?c:'#f8fafc') + '" onchange="setTextColor(\'' + def.k + '\', this.value, true)" style="flex:0 0 4vh;height:3vh;padding:0;border:1px solid #334155;border-radius:4px;background:transparent;cursor:pointer;"/>' +
                '<input id="tsHex-' + def.k + '" type="text" maxlength="7" value="' + c + '" onchange="setTextColor(\'' + def.k + '\', this.value, true)" style="flex:0 0 8vh;padding:0.3vh 0.5vh;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:4px;font-family:Consolas,monospace;font-size:1.4vh;text-align:center;"/>' +
                '<select id="tsFont-' + def.k + '" onchange="setTextFont(\'' + def.k + '\', this.value, true)" style="flex:1;min-width:0;padding:0.4vh 0.5vh;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:4px;font-size:1.5vh;cursor:pointer;">' + fontOpts + '</select>' +
                '<button onclick="resetTextStyle(\'' + def.k + '\')" title="恢复默认" style="flex:0 0 3.5vh;height:3vh;background:#334155;color:#cbd5e1;border:none;border-radius:4px;cursor:pointer;font-size:1.5vh;">↺</button>' +
            '</div>';
    }
    host.innerHTML = html;
    host.dataset.built = '1';
}
function toggleTextStyle() {
    var panel = document.getElementById('textStylePanel');
    if (!panel) return;
    if (panel.classList.contains('hidden')) {
        _buildTextStylePanelRows();
        panel.classList.remove('hidden');
    } else {
        panel.classList.add('hidden');
    }
}
(function() {
    var s = _getTextStyleState();
    for (var i = 0; i < TEXT_KEYS.length; i++) {
        var def = TEXT_KEYS[i];
        var saved = s[def.k] || {};
        if (saved.c) document.documentElement.style.setProperty('--c-' + def.k, saved.c);
        if (saved.f) document.documentElement.style.setProperty('--ff-' + def.k, saved.f);
    }
})();

// 兼容旧版：保留 prompt() 形式询问 IP，外部代码或特殊场景仍可调用
function getServerHost(forceAsk) {
    var params = new URLSearchParams(window.location.search);
    if (params.get('host')) return params.get('host');
    if (!forceAsk && location.hostname && location.hostname !== '' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return location.hostname;
    var saved = localStorage.getItem('swimServerHost');
    if (!forceAsk && saved) return saved;
    var def = saved || '192.168.1.100';
    var ip = prompt('请输入服务器IP地址:', def);
    if (ip) { localStorage.setItem('swimServerHost', ip); return ip; }
    return saved || 'localhost';
}
function changeServerHost() {
    showConnectOverlay('请重新输入服务器IP并点击连接', '#f59e0b');
    _connFailCount = 0;
    var inp = document.getElementById('connHostInput');
    if (!inp || !document.getElementById('connectOverlay')) {
        var h = getServerHost(true);
        if (ws) try { ws.close(); } catch(e) {}
        connect();
    }
}

function connect() {
    var host = getServerHost();
    try { ws = new WebSocket('ws://' + host + ':3002'); }
    catch (ex) { showConnectOverlay('连接失败：' + ex.message, '#ef4444'); return; }
    ws.onopen = function() {
        _connFailCount = 0;
        ws.send(JSON.stringify({type: 'LEADERBOARD_IDENTITY'}));
        hideConnectOverlay();   // 只有连接成功才隐藏遮罩
    };
    // requestAnimationFrame 合并：手机端高频广播时只保留最新一份，下一帧统一渲染，避免积压
    ws.onmessage = function(e) {
        var msg;
        try { msg = JSON.parse(e.data); } catch (er) { return; }
        // 排名屏不展示滚动时间，跳过 0.1s 节拍的轻量帧避免覆盖完整 data
        if (msg.type === 'RUNNING_TIME_UPDATE') return;
        _pendingData = msg.data || {};
        if (_renderScheduled) return;
        _renderScheduled = true;
        var doIt = function() {
            _renderScheduled = false;
            data = _pendingData || {};
            try { render(); } catch (er2) {}
        };
        if (window.requestAnimationFrame) requestAnimationFrame(doIt);
        else setTimeout(doIt, 16);
    };
    ws.onclose = function() {
        _connFailCount++;
        showConnectOverlay('未连接 / 连接断开（已尝试 ' + _connFailCount + ' 次），3 秒后自动重连…', '#ef4444');
        // 与旧版兼容：每 3 次失败后再用 confirm() 兜底询问一次
        if (_connFailCount >= 3) {
            _connFailCount = 0;
            if (confirm('连接失败，是否重新设置服务器地址？')) { changeServerHost(); return; }
        }
        setTimeout(connect, 3000);
    };
    ws.onerror = function() {
        showConnectOverlay('连接错误，请检查服务器IP是否正确', '#ef4444');
    };
}

function showTab(tab) {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    event.target.classList.add('active');
    document.getElementById('rankingView').style.display = tab === 'ranking' ? '' : 'none';
    document.getElementById('teamView').style.display = tab === 'team' ? '' : 'none';
    document.getElementById('recordsView').style.display = tab === 'records' ? '' : 'none';
}

function render() {
    document.getElementById('title').textContent = data.competitionName || '排名显示';

    // 项目排名（接力：代表队在前，姓名在后）
    var lbRelay = (data.currentEvent||'').indexOf('接力') >= 0;
    var h1 = lbRelay ? '代表队' : '姓名';
    var h2 = lbRelay ? '姓名' : '代表队';
    var html = '<div class="section-title">' + ((data.currentAgeGroup||'')?(data.currentAgeGroup+' '):'') + (data.currentGender||'') + '子 ' + (data.currentEvent||'') + ' ' + (data.currentStage||'') + '</div>';
    html += '<table><tr><th>名次</th><th>' + h1 + '</th><th>' + h2 + '</th><th>成绩</th><th>备注</th></tr>';
    var er = data.eventRanking || [];
    for (var i = 0; i < er.length; i++) {
        var rc = er[i].rank >= 1 && er[i].rank <= 3 ? ' class="rank-' + er[i].rank + '"' : '';
        var c1 = lbRelay ? (er[i].country||'') : (er[i].name||'');
        var c2 = lbRelay ? (er[i].name||'') : (er[i].country||'');
        var remark = er[i].resultStatus || er[i].status || '';
        var rankText = er[i].rank > 0 ? er[i].rank : '-';
        html += '<tr' + rc + '><td>' + rankText + '</td><td>' + c1 + '</td><td>' + c2 + '</td><td>' + (er[i].finalTime||'') + '</td><td class="lb-remark">' + remark + '</td></tr>';
    }
    html += '</table>';
    document.getElementById('rankingView').innerHTML = html;

    // 团体
    html = '<div class="section-title">团体积分排名</div>';
    html += '<table><tr><th>名次</th><th>代表队</th><th>总分</th><th>金</th><th>银</th><th>铜</th></tr>';
    var ts = data.teamScores || [];
    for (var i = 0; i < ts.length; i++) {
        html += '<tr><td>' + ts[i].rank + '</td><td>' + ts[i].teamName + '</td><td>' + ts[i].totalPoints + '</td><td>' + ts[i].gold + '</td><td>' + ts[i].silver + '</td><td>' + ts[i].bronze + '</td></tr>';
    }
    html += '</table>';
    document.getElementById('teamView').innerHTML = html;

    // 纪录
    html = '<div class="section-title">纪录榜</div>';
    html += '<table><tr><th>项目</th><th>类型</th><th>保持者</th><th>成绩</th></tr>';
    var rs = data.records || [];
    for (var i = 0; i < rs.length; i++) {
        html += '<tr><td>' + rs[i].eventName + '</td><td>' + rs[i].recordType + '</td><td>' + rs[i].holderName + '</td><td>' + rs[i].time + '</td></tr>';
    }
    html += '</table>';
    document.getElementById('recordsView').innerHTML = html;
}

// 启动：先把已知/默认的服务器IP填入遮罩输入框，并立即触发一次连接尝试
(function bootstrap() {
    var inp = document.getElementById('connHostInput');
    if (inp) {
        inp.value = getInitialHost();
        inp.addEventListener('keydown', function(ev) { if (ev.key === 'Enter') overlayConnect(); });
    }
    showConnectOverlay('连接中… ' + getInitialHost() + ':3002', '#f59e0b');
    connect();
})();
</script>
